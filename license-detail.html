<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="trakdb1.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — license detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#505050;--dim:#303030;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --green:#4cc38a;--green-d:rgba(76,195,138,.12);
  --red:#e0667a;--red-d:rgba(224,102,122,.12);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

.topnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;align-items:center}
.topnav-link{font-size:14px;color:var(--muted);text-decoration:none;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s}
.topnav-link:hover,.topnav-link.active{color:var(--text)}

header{padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:#295ad6;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:none;flex-shrink:0;text-decoration:none}
.logo-mark svg{color:#fff}
.logo-name{font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);font-family:'Geist Mono',monospace;text-decoration:none}
.logo-name em{font-style:normal;color:#6285e4}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}

.back-link{position:absolute;top:110px;right:0;display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-decoration:none;transition:color .15s;z-index:2}
.back-link:hover{color:var(--text)}
.back-link svg{width:14px;height:14px}

.detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;margin-top:44px}
.detail-card-header{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px}
.detail-header-name{margin-left:auto;margin-right:auto;display:flex;align-items:center;gap:10px}.detail-header-name-val{font-size:22px;font-weight:500;color:var(--text)}
.detail-header-status{flex-shrink:0}
.detail-card-header-avatar{width:52px;height:52px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--card-h);border:1px solid var(--border)}
.detail-card-header-avatar img{width:100%;height:100%;object-fit:cover}
.detail-track-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.detail-track{font-size:22px;font-weight:600;letter-spacing:-.3px}
.play-btn{width:30px;height:30px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s;padding:0}
.play-btn:hover{opacity:.8}
.play-btn svg{color:#fff;width:13px;height:13px}
.detail-artist{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.detail-rows{padding:8px 0}
.detail-row{display:flex;align-items:center;padding:14px 28px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);width:120px;flex-shrink:0;letter-spacing:.3px;text-transform:uppercase}
.detail-val{font-size:14px;color:var(--text)}
.detail-input{flex:1;background:var(--card-h);border:1px solid var(--border-b);border-radius:8px;padding:7px 11px;font-size:14px;color:var(--text);font-family:'Geist',system-ui,sans-serif;outline:none;transition:border-color .15s}
.detail-input:focus{border-color:var(--accent)}
.detail-textarea{resize:vertical;min-height:64px;line-height:1.5}
.edit-actions{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--border);min-height:60px}
.edit-save{background:var(--accent);color:#fff;border:1px solid transparent;border-radius:8px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:opacity .15s}
.edit-save:hover{opacity:.8}
.edit-cancel{background:transparent;color:var(--muted);border:1px solid var(--border-b);border-radius:8px;padding:8px 18px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s}
.edit-cancel:hover{color:var(--text);border-color:var(--dim)}
.detail-header-right{display:flex;flex-direction:row;align-items:center;gap:10px;flex-shrink:0}
.edit-btn{background:transparent;border:1px solid var(--border-b);border-radius:8px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.edit-btn:hover{color:var(--text);border-color:var(--dim)}
.edit-status{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:0 28px 12px;min-height:14px}
.notes-textarea{width:100%;min-height:100px;background:var(--card-h);border:1px solid var(--border);border-radius:8px;resize:vertical;padding:10px 12px;color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.6;outline:none;transition:border-color .15s;box-sizing:border-box}
.notes-textarea:focus{border-color:var(--accent)}
.notes-save-btn{padding:5px 12px;background:var(--accent);border:none;border-radius:7px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:opacity .15s;display:none}
.notes-save-btn:hover{opacity:.8}
.notes-cancel-btn{padding:5px 12px;background:transparent;border:1px solid var(--border-b);border-radius:7px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:color .15s,border-color .15s;display:none}
.notes-cancel-btn:hover{color:var(--text);border-color:var(--dim)}
.notes-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}

.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.badge-active{background:var(--green-d);color:var(--green)}
.badge-pending{background:var(--gold-d);color:var(--gold)}
.badge-expired,.badge-denied{background:var(--red-d);color:var(--red)}
.badge-approved{background:var(--green-d);color:var(--green)}
.badge-type{background:var(--accent-d);color:var(--accent)}
.status-wrap{position:relative;display:inline-block}
.status-wrap .badge{cursor:pointer;user-select:none}
.status-wrap .badge:hover{opacity:.8}
.status-dropdown{display:none;position:absolute;top:calc(100% + 5px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:8px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:100px}
.status-dropdown.open{display:block}
.status-option{padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap}
.status-option:hover{background:var(--card-h)}
.approver-list{display:flex;flex-direction:column;gap:6px}
.approver-item{display:flex;align-items:center;gap:7px}
.approver-check{color:var(--green,#4caf50);font-size:13px;flex-shrink:0;opacity:0;transition:opacity .2s;line-height:1}
.approver-check.visible{opacity:1}
.approver-del{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s;flex-shrink:0}
.approver-del:hover{color:var(--red,#f55)}
.approver-clip{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 2px;line-height:1;transition:color .15s;flex-shrink:0;display:flex;align-items:center}
.approver-clip:hover{color:var(--text)}
.add-approver-btn{background:none;border:1px dashed var(--border-b);border-radius:8px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 12px;cursor:pointer;transition:color .15s,border-color .15s;margin-top:2px;align-self:flex-start}
.add-approver-btn:hover{color:var(--text);border-color:var(--border)}
.approver-files{display:flex;gap:5px;flex-wrap:wrap;margin-left:6px}
.approver-file-chip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:5px;padding:2px 7px;text-decoration:none;transition:color .15s,border-color .15s;white-space:nowrap}
.approver-file-chip{cursor:pointer}
.approver-file-chip:hover{color:var(--text);border-color:var(--border-b)}
.file-preview-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:40px}
.file-preview-overlay.open{display:flex}
.file-preview-modal{background:var(--card);border:1px solid var(--border-b);border-radius:14px;width:min(900px,100%);height:min(85vh,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.file-preview-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.file-preview-title{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.file-preview-dl{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted);text-decoration:none;transition:color .15s,background .15s}
.file-preview-dl:hover{color:var(--text);background:var(--card-h)}
.file-preview-close{width:30px;height:30px;border:none;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:8px;transition:color .15s,background .15s}
.file-preview-close:hover{color:var(--text);background:var(--card-h)}
.file-preview-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#0d0d0f);overflow:auto}
.file-preview-frame{width:100%;height:100%;border:none;background:#fff}
.file-preview-img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.file-preview-loading{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:40px;text-align:center}
.file-preview-loading a{color:var(--text)}

.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:"JetBrains Mono",monospace}
.avatar:hover{opacity:.8}

footer{padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim)}

.attach-section{margin-bottom:48px}
.attach-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px}
.attach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.attach-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-size:13px;transition:background .15s,border-color .15s}
.attach-item:hover{background:var(--card-h);border-color:var(--border-b)}
.attach-delete{margin-left:auto;flex-shrink:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;transition:color .15s}
.attach-delete:hover{color:var(--red)}
.attach-item-icon{color:var(--muted);flex-shrink:0}
.attach-item-name{flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;background:transparent;border:1px dashed var(--border-b);border-radius:var(--radius);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.upload-row:hover{background:var(--card);color:var(--text);border-color:var(--accent-g)}
/* Split upload/forms control — one bordered button divided into two parts */
.upload-split{display:flex;align-items:stretch;border:1px dashed var(--border-b);border-radius:var(--radius);transition:border-color .15s}
.upload-split:hover{border-color:var(--accent-g)}
.upload-split .upload-row{flex:8;margin:0;border:none;border-radius:calc(var(--radius) - 1px) 0 0 calc(var(--radius) - 1px)}
.upload-split .upload-row:hover{background:var(--card);color:var(--text);border-color:transparent}
.forms-wrap{flex:2;position:relative;display:flex}
.forms-btn{flex:1;padding:12px 10px;background:transparent;border:none;border-left:1px dashed var(--border-b);border-radius:0 calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.forms-btn:hover{background:var(--card);color:var(--text)}
/* Dropdown styled like the status (active/pending/expired) badge menu */
.forms-dropdown{display:none;position:absolute;bottom:calc(100% + 5px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:8px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:200px}
.forms-dropdown.open{display:block}
.forms-dropdown-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding:9px 14px 6px}
.forms-item{display:flex;align-items:center;gap:9px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap;text-decoration:none;color:var(--text)}
.forms-item:hover{background:var(--card-h)}
.forms-item-icon{color:var(--muted);flex-shrink:0;display:flex}
.forms-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.forms-empty{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:10px 14px;text-align:center}
.upload-status{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;min-height:14px}

:root[data-theme="light"]{--bg:#f4f6f9;--surface:#ffffff;--card:#ffffff;--card-h:#eceff4;--border:#e4e8ee;--border-b:#d2d8e0;--text:#1b1e23;--muted:#5c6470;--dim:#9299a4;}
:root[data-theme="light"] body{background:radial-gradient(130% 100% at 50% 0%,#e8edf6 0%,var(--bg) 60%) fixed;}
:root[data-theme="light"] .list-table thead tr:hover{background:var(--card-h)}
:root[data-theme="light"] .orb{opacity:.55}

/* --- mobile responsive pass --- */
.nav-toggle{display:none;background:none;border:1px solid var(--border-b);border-radius:9px;padding:7px;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.nav-toggle:hover{color:var(--text);border-color:var(--dim)}
.nav-mobile-prof,.nav-mobile-acct{display:none}
.nav-mobile-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#2d1b69,#6285e4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.nav-mobile-name{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text)}
@media(max-width:640px){
  html{background:var(--bg)}
  .back-link{right:24px}
  header{padding:28px 0 20px;gap:12px}
  .logo-mark{width:48px;height:48px;border-radius:13px}
  .logo-mark svg{width:23px;height:23px}
  .logo-name{font-size:25px}
  .nav-toggle{padding:12px}
  .nav-toggle svg{width:24px;height:24px}
  body{font-size:14px}
  .stat-val{font-size:22px}
  .stat-card{padding:18px 20px}
  .track-title{font-size:26px}
  .detail-track{font-size:20px}
  .detail-header-name-val{font-size:15px}
  .profile-name{font-size:21px}
  .tc-name{font-size:15px}
  .artist-card-name{font-size:17px}
  .nav-toggle{display:flex}
  .avatar-wrap{display:none}
  .logo{margin-right:auto}
  .topnav{display:none}
  .topnav.open .nav-mobile-prof{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--border);text-decoration:none}
  .topnav.open .nav-mobile-acct{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .topnav.open{display:flex;flex-direction:column;gap:2px;position:absolute;top:calc(100% - 2px);right:0;left:auto;transform:none;background:var(--card);border:1px solid var(--border-b);border-radius:12px;padding:8px;min-width:190px;z-index:150;box-shadow:0 12px 32px rgba(0,0,0,.45);align-items:stretch}
  .topnav.open .topnav-link{padding:10px 14px;border-radius:8px;font-size:14px;text-align:left}
  .topnav.open .topnav-link:hover,.topnav.open .topnav-link.active{background:var(--card-h)}
  .stat-grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
  .table-scroll .list-table{min-width:560px}
  .detail-card-header{flex-wrap:wrap;gap:14px 14px;padding:20px}
  .detail-header-name{order:3;width:100%;margin:0;justify-content:flex-start}
  .detail-header-name-val{font-size:16px;word-break:break-all}
  .detail-header-right{order:2;margin-left:auto}
  .detail-row{padding:14px 20px}
  .detail-label{width:96px}
  .back-link{top:96px}
}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('trakdb_settings')||'{}');if(s.theme==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <a href="index.html" class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
          <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
          <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
          <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
        </svg>
      </a>
      <a href="index.html" class="logo-name">trak<em>db</em></a>
    </div>
    <nav class="topnav">
      <a href="index.html" class="topnav-link">home</a>
      <a href="music.html" class="topnav-link">music</a>
      <a href="licenses.html" class="topnav-link active">licenses</a>
      <a href="payments.html" class="topnav-link">payments</a>
      <a href="tools.html" class="topnav-link">tools</a>
    </nav>
    <div class="avatar" title="account">?</div>
  </header>

  <a href="licenses.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    back to licenses
  </a>

  <div class="section-header" style="display:none"><div class="section-title" id="page-kind">License</div></div>

  <div class="detail-card">
    <div class="detail-card-header">
      <div class="detail-card-header-avatar"><img id="artist-avatar" alt=""></div>
      <div>
        <div class="detail-track-row">
          <div class="detail-track" id="d-track">—</div>
          <button class="play-btn" id="play-btn" title="Play">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="7,3 21,12 7,21"/></svg>
          </button>
        </div>
        <div class="detail-artist" id="d-artist">—</div>
      </div>

  <footer>© 2026 trakdb</footer>
</div>
<script>
const params  = new URLSearchParams(location.search);
const kind    = params.get('kind') || 'license';
const isReq   = kind === 'request';
const artist  = params.get('artist')  || '—';
const track   = params.get('track')   || '—';
const name    = params.get('name')    || '';
const type    = params.get('type')    || '—';
const licensee = params.get('licensee') || '—';
const issued  = params.get('issued')  || '—';
const status      = params.get('status')      || '—';
const notes       = params.get('notes')       || '';
function parseApprovers(raw) {
  try { const a = JSON.parse(raw || '[]'); return Array.isArray(a) ? a : []; }
  catch { return []; }
}
const approvers = parseApprovers(params.get('approvers'));

const session  = JSON.parse(localStorage.getItem('trakdb_session') || 'null') || { username: 'Admin1' };
const username = session.username;
const GH_OWNER = 'desousabrian', GH_REPO = 'desousabrian.github.io', GH_BRANCH = 'main';

document.title = `trakdb — ${track}`;
document.getElementById('page-kind').textContent = isReq ? 'Request' : 'License';
document.getElementById('d-track').textContent   = track;
document.getElementById('d-artist').textContent  = artist;
if (name) {
  document.getElementById('d-name').textContent = name;
  document.getElementById('d-name-wrap').style.display = '';
}
if (status) {
  const sw = document.getElementById('d-status-wrap');
  sw.innerHTML = statusBadge(status);
  sw.style.display = '';
}
document.getElementById('artist-avatar').src = `https://desousabrian.github.io/companies/EG Publishing/accounts/${username}/artists/${encodeURIComponent(artist)}/avatar.jpeg`;

function statusClass(s) {
  const l = (s||'').trim().toLowerCase();
  return l==='active'||l==='approved' ? 'badge-active' : l==='expired'||l==='denied' ? 'badge-expired' : 'badge-pending';
}
function statusBadge(s) {
  return `<span class="badge ${statusClass(s)}">${s}</span>`;
}

let cur = { type, licensee, issued, notes, status, approvers };
let isEditing = false;

function renderRows(editing) {
  const detailRows  = document.getElementById('detail-rows');
  const editBtn     = document.getElementById('edit-btn');
  const headerRight = document.getElementById('detail-header-right');
  const existing    = document.getElementById('edit-save-btn');
  if (existing) existing.remove();
  isEditing = editing;
  loadAttachments();
  const sw = document.getElementById('d-status-wrap');
  if (!editing) {
    sw.innerHTML = statusBadge(cur.status);
    editBtn.textContent = 'edit';
    const fields = [
      [isReq ? 'Requester' : 'Licensee', cur.licensee, false],
      ['Type',                             cur.type,     true],
      [isReq ? 'Received'  : 'Issued',    cur.issued,   false],
    ];
    const approvalValHtml = cur.approvers.length === 0
      ? `<span class="detail-val" style="color:var(--muted)">—</span>`
      : `<div class="approver-list">${cur.approvers.map((a, i) =>
          `<div class="approver-item">
            <span class="approver-check${a.date ? ' visible' : ''}">✓</span>
            <span class="detail-val">${a.name || '—'}${a.date ? ' · ' + a.date : ''}</span>
            <span class="approver-files" id="afiles-${i}"></span>
          </div>`).join('')}</div>`;
    detailRows.innerHTML = fields.map(([l, v, isType]) =>
      `<div class="detail-row"><span class="detail-label">${l}</span>${isType ? `<span class="badge badge-type" style="margin-left:-9px">${v || '—'}</span>` : `<span class="detail-val">${v || '—'}</span>`}</div>`
    ).join('') +
    `<div class="detail-row"><span class="detail-label">Approvals</span>${approvalValHtml}</div>`;
    if (approvalsBase) cur.approvers.forEach((a, i) => a.name && loadApproverFiles(a.name, i));
  } else {
    const statusOptions = isReq ? ['Pending','Approved','Denied'] : ['Active','Pending','Expired'];
    sw.innerHTML = '';
    const swWrap = document.createElement('div');
    swWrap.className = 'status-wrap';
    swWrap.dataset.selected = cur.status;
    const swBadge = document.createElement('span');
    swBadge.className = `badge ${statusClass(cur.status)}`;
    swBadge.textContent = cur.status;
    const swDrop = document.createElement('div');
    swDrop.className = 'status-dropdown';
    swDrop.innerHTML = statusOptions.map(o => `<div class="status-option">${o}</div>`).join('');
    swWrap.appendChild(swBadge);
    swWrap.appendChild(swDrop);
    swBadge.addEventListener('click', e => { e.stopPropagation(); swDrop.classList.toggle('open'); });
    document.addEventListener('click', () => swDrop.classList.remove('open'));
    swDrop.querySelectorAll('.status-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const val = opt.textContent;
        swWrap.dataset.selected = val;
        swBadge.textContent = val;
        swBadge.className = `badge ${statusClass(val)}`;
        swDrop.classList.remove('open');
      });
    });
    sw.appendChild(swWrap);
    editBtn.textContent = 'cancel';
    const saveBtn = document.createElement('button');
    saveBtn.id = 'edit-save-btn';
    saveBtn.className = 'edit-save';
    saveBtn.textContent = 'save';
    saveBtn.addEventListener('click', saveEdits);
    headerRight.insertBefore(saveBtn, editBtn);
    detailRows.innerHTML = `
      <div class="detail-row"><span class="detail-label">${isReq ? 'Requester' : 'Licensee'}</span><input class="detail-input" id="e-licensee" value="${cur.licensee}"></div>
      <div class="detail-row"><span class="detail-label">Type</span><span id="e-type-placeholder"></span></div>
      <div class="detail-row"><span class="detail-label">${isReq ? 'Received' : 'Issued'}</span><input class="detail-input" id="e-issued" type="text" placeholder="M/DD/YYYY" value="${cur.issued}"></div>
      <div class="detail-row" id="approvals-edit-row" style="align-items:flex-start"><span class="detail-label" style="padding-top:6px">Approvals</span><div id="e-approvers-container" class="approver-list"></div></div>`;
    const typeOptions = ['Sync','Mechanical','Master','Print','Other'];
    const twWrap = document.createElement('div');
    twWrap.className = 'status-wrap';
    twWrap.id = 'e-type-wrap';
    twWrap.dataset.selected = cur.type;
    const twBadge = document.createElement('span');
    twBadge.className = 'badge badge-type';
    twBadge.textContent = cur.type;
    const twDrop = document.createElement('div');
    twDrop.className = 'status-dropdown';
    twDrop.innerHTML = typeOptions.map(o => `<div class="status-option">${o}</div>`).join('');
    twWrap.appendChild(twBadge);
    twWrap.appendChild(twDrop);
    twBadge.addEventListener('click', e => { e.stopPropagation(); twDrop.classList.toggle('open'); });
    document.addEventListener('click', () => twDrop.classList.remove('open'));
    twDrop.querySelectorAll('.status-option').forEach(opt => {
      opt.addEventListener('click', () => {
        twWrap.dataset.selected = opt.textContent;
        twBadge.textContent = opt.textContent;
        twDrop.classList.remove('open');
      });
    });
    document.getElementById('e-type-placeholder').replaceWith(twWrap);
    const approversContainer = document.getElementById('e-approvers-container');
    function makeApproverRow(a = {}) {
      const row = document.createElement('div');
      row.className = 'approver-item';
      const nameInput = document.createElement('input');
      nameInput.className = 'detail-input';
      nameInput.placeholder = 'Approver name';
      nameInput.value = a.name || '';
      const dateInput = document.createElement('input');
      dateInput.className = 'detail-input';
      dateInput.type = 'text';
      dateInput.placeholder = 'M/DD/YYYY';
      dateInput.style.width = '110px';
      dateInput.value = a.date || '';
      const check = document.createElement('span');
      check.className = 'approver-check' + (a.date ? ' visible' : '');
      check.textContent = '✓';
      dateInput.addEventListener('input', () => {
        check.classList.toggle('visible', dateInput.value.trim().length > 0);
      });
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.style.display = 'none';
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        fileInput.value = '';
        if (!file || !approvalsBase) return;
        const folderName = sanitizeFolderName(nameInput.value);
        const pat = await getValidPat();
        if (!pat) return;
        try {
          setStatus('uploading…');
          const buf = await file.arrayBuffer();
          const path = `${approvalsBase}/${folderName}/${file.name}`;
          const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`,
            { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify({ message: `Attach approval file: ${file.name}`, content: arrayBufferToB64(buf), branch: GH_BRANCH }) });
          if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `Upload failed (${res.status})`); }
          setStatus('uploaded ✓');
          loadAttachments();
          setTimeout(() => setStatus(''), 2500);
        } catch(err) { setStatus(`failed: ${err.message}`, true); }
      });
      const clip = document.createElement('button');
      clip.className = 'approver-clip';
      clip.type = 'button';
      clip.title = 'Attach file';
      clip.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`;
      clip.addEventListener('click', () => fileInput.click());
      const del = document.createElement('button');
      del.className = 'approver-del';
      del.textContent = '×';
      del.type = 'button';
      del.addEventListener('click', () => row.remove());
      row.appendChild(nameInput);
      row.appendChild(dateInput);
      row.appendChild(check);
      row.appendChild(fileInput);
      row.appendChild(clip);
      row.appendChild(del);
      return row;
    }
    (cur.approvers.length ? cur.approvers : [{}]).forEach(a => approversContainer.appendChild(makeApproverRow(a)));
    const addBtn = document.createElement('button');
    addBtn.className = 'add-approver-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+ add approver';
    addBtn.addEventListener('click', () => approversContainer.insertBefore(makeApproverRow(), addBtn));
    approversContainer.appendChild(addBtn);
  }
}

const folderKind      = isReq ? 'licensing/requests' : 'licensing/licenses';
const filesPath       = name ? `companies/EG Publishing/accounts/${username}/${folderKind}/${name}/files` : null;
const approvalsBase   = name ? `companies/EG Publishing/accounts/${username}/${folderKind}/${name}/approvals` : null;
function sanitizeFolderName(n) { return (n || 'approver').trim().replace(/[/\\:*?"<>|]/g, '-'); }

renderRows(false);

// inline notes — always visible, saves independently to col[6] of the CSV
(function initNotes() {
  const ta        = document.getElementById('notes-textarea');
  const saveBtn   = document.getElementById('notes-save');
  const cancelBtn = document.getElementById('notes-cancel');
  const statusEl  = document.getElementById('notes-status');
  ta.value = cur.notes || '';
  function updateBtns() {
    const dirty = ta.value !== (cur.notes || '');
    saveBtn.style.display   = dirty ? 'inline-block' : 'none';
    cancelBtn.style.display = dirty ? 'inline-block' : 'none';
  }
  ta.addEventListener('input', updateBtns);
  cancelBtn.addEventListener('click', () => { ta.value = cur.notes || ''; updateBtns(); statusEl.textContent = ''; });
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    statusEl.textContent = 'saving…';
    try {
      const pat = await getValidPat();
      if (!pat) { saveBtn.disabled = false; statusEl.textContent = ''; return; }
      const csvFile = isReq ? 'request.csv' : 'license.csv';
      const csvPath = `companies/EG Publishing/accounts/${username}/${folderKind}/${name}/${csvFile}`;
      const apiUrl  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${csvPath}`;
      const fileRes = await fetch(apiUrl, { headers: ghHeaders(pat) });
      if (!fileRes.ok) throw new Error(`Could not fetch CSV (${fileRes.status})`);
      const fileJson = await fileRes.json();
      const existing = atob(fileJson.content.replace(/\n/g, ''));
      const lines = existing.split('\n').filter(l => l.trim());
      const dataLine = lines[1] || '';
      function parseCSV(l) {
        const cols = []; let c = '', q = false;
        for (let i = 0; i < l.length; i++) {
          const ch = l[i];
          if (ch==='"') { if (q && l[i+1]==='"') { c+='"'; i++; } else q=!q; }
          else if (ch===','&&!q){cols.push(c);c='';}else c+=ch;
        }
        cols.push(c); return cols;
      }
      function csvVal(v) { return v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g,'""')}"` : v; }
      const cols = parseCSV(dataLine);
      cols[6] = ta.value.trim();
      cols.length = Math.max(cols.length, 8);
      const fullHeader = 'Artist,Track,Type,Licensee,Issued,Status,Notes,Approvers';
      const newContent = btoa(unescape(encodeURIComponent(`${fullHeader}\n${cols.map(csvVal).join(',')}\n`)));
      const putRes = await fetch(apiUrl, { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify({ message: `Update notes: ${name}`, content: newContent, sha: fileJson.sha, branch: GH_BRANCH }) });
      if (!putRes.ok) { const e = await putRes.json().catch(()=>({})); throw new Error(e.message || `Save failed (${putRes.status})`); }
      cur.notes = ta.value.trim();
      const p = new URLSearchParams(location.search);
      p.set('notes', cur.notes);
      history.replaceState(null, '', `?${p}`);
      saveBtn.style.display = 'none';
      cancelBtn.style.display = 'none';
      statusEl.textContent = 'saved ✓';
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    } catch(err) {
      statusEl.textContent = err.message;
    } finally {
      saveBtn.disabled = false;
    }
  });
})();

document.getElementById('edit-btn').addEventListener('click', () => {
  const editing = document.getElementById('edit-btn').textContent === 'edit';
  renderRows(editing);
});

async function saveEdits() {
  if (!name) return;
  const saveBtn = document.getElementById('edit-save-btn');
  const statusEl = document.getElementById('upload-status');
  const newLicensee    = document.getElementById('e-licensee').value.trim();
  const newType        = document.getElementById('e-type-wrap')?.dataset.selected || cur.type;
  const newIssued      = document.getElementById('e-issued').value.trim();
  const newNotes       = document.getElementById('notes-textarea')?.value.trim() ?? cur.notes;
  const newStatus      = document.querySelector('#d-status-wrap .status-wrap')?.dataset.selected || cur.status;
  const newApprovers   = Array.from(document.querySelectorAll('#e-approvers-container .approver-item')).map(row => ({
    name: row.querySelectorAll('input')[0]?.value.trim() || '',
    date: row.querySelectorAll('input')[1]?.value.trim() || '',
  })).filter(a => a.name);
  saveBtn.disabled = true;
  statusEl.textContent = 'saving…';
  try {
    const pat = await getValidPat();
    if (!pat) { saveBtn.disabled = false; statusEl.textContent = ''; return; }
    const csvFile = isReq ? 'request.csv' : 'license.csv';
    const csvPath = `companies/EG Publishing/accounts/${username}/${folderKind}/${name}/${csvFile}`;
    const apiUrl  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${csvPath}`;
    const fileRes = await fetch(apiUrl, { headers: ghHeaders(pat) });
    if (!fileRes.ok) throw new Error(`Could not fetch CSV (${fileRes.status})`);
    const fileJson = await fileRes.json();
    const existing = atob(fileJson.content.replace(/\n/g, ''));
    const lines = existing.split('\n').filter(l => l.trim());
    const header = lines[0] || 'Artist,Track,Type,Licensee,Issued,Status,Notes';
    const dataLine = lines[1] || '';
    function parseCSV(l) {
      const cols = []; let c = '', q = false;
      for (let i = 0; i < l.length; i++) {
        const ch = l[i];
        if (ch==='"') { if (q && l[i+1]==='"') { c+='"'; i++; } else q=!q; }
        else if (ch===','&&!q){cols.push(c);c='';}else c+=ch;
      }
      cols.push(c); return cols;
    }
    function csvVal(v) { return v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g,'""')}"` : v; }
    const cols = parseCSV(dataLine);
    cols[2] = newType;
    cols[3] = newLicensee;
    cols[4] = newIssued;
    cols[5] = newStatus;
    cols[6] = newNotes;
    cols[7] = JSON.stringify(newApprovers);
    cols.length = 8;
    const fullHeader = 'Artist,Track,Type,Licensee,Issued,Status,Notes,Approvers';
    const newData = cols.map(csvVal).join(',');
    const newContent = btoa(unescape(encodeURIComponent(`${fullHeader}\n${newData}\n`)));
    const putRes = await fetch(apiUrl, { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify({ message: `Update ${name}`, content: newContent, sha: fileJson.sha, branch: GH_BRANCH }) });
    if (!putRes.ok) { const e = await putRes.json().catch(()=>({})); throw new Error(e.message || `Save failed (${putRes.status})`); }
    cur = { type: newType, licensee: newLicensee, issued: newIssued, notes: newNotes, status: newStatus, approvers: newApprovers };
    const notesSaveBtn   = document.getElementById('notes-save');
    const notesCancelBtn = document.getElementById('notes-cancel');
    if (notesSaveBtn)   notesSaveBtn.style.display   = 'none';
    if (notesCancelBtn) notesCancelBtn.style.display = 'none';
    const p = new URLSearchParams(location.search);
    p.set('type', newType); p.set('licensee', newLicensee); p.set('issued', newIssued); p.set('notes', newNotes); p.set('status', newStatus);
    p.set('approvers', JSON.stringify(newApprovers));
    history.replaceState(null, '', `?${p}`);
    renderRows(false);
    setStatus('saved ✓');
    setTimeout(() => setStatus(''), 2500);
    if (approvalsBase) {
      newApprovers.forEach(a => {
        const keepPath = `${approvalsBase}/${sanitizeFolderName(a.name)}/.keep`;
        fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(keepPath)}`, {
          method: 'PUT', headers: ghHeaders(pat),
          body: JSON.stringify({ message: `Init approver folder: ${a.name}`, content: btoa(''), branch: GH_BRANCH })
        }).catch(() => {});
      });
    }
  } catch(err) {
    setStatus(`failed: ${err.message}`, true);
    saveBtn.disabled = false;
  }
}

/* ---- Song lookup + play button ---- */
(async () => {
  const songsPath = `companies/EG Publishing/accounts/${username}/artists/${encodeURIComponent(artist)}/songs`;
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${songsPath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const files = await res.json();
    if (!Array.isArray(files)) return;
    const match = files.find(f => f.type === 'file' && f.name.replace(/\.[^.]+$/, '') === track);
    if (!match) return;
    const src = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${songsPath}/${encodeURIComponent(match.name)}`;
    const audio = new Audio();
    audio.preload = 'none';
    audio.src = src;
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    btn.style.display = 'flex';
    const pauseSVG = `<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>`;
    const playSVG  = `<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><polygon points="7,3 21,12 7,21"/></svg>`;
    btn.addEventListener('click', () => {
      if (audio.paused) { audio.play(); btn.innerHTML = pauseSVG; }

})();

/* ---- Attachments ---- */

const attachInner   = document.getElementById('attach-inner');
const attachList    = document.getElementById('attach-list');
const uploadRow     = document.getElementById('upload-row');
const uploadInput   = document.getElementById('upload-input');
const uploadStatus  = document.getElementById('upload-status');
const uploadWrap    = document.getElementById('upload-wrap');

if (!filesPath) uploadWrap.style.display = 'none';

function ghHeaders(pat) {
  return { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' };
}
function arrayBufferToB64(buf) {
  const bytes = new Uint8Array(buf); let binary = ''; const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}
function setStatus(msg, isError) {
  uploadStatus.textContent = msg;
  uploadStatus.style.color = isError ? '#e0667a' : 'var(--muted)';
}
function getPat() {
  let pat = localStorage.getItem('gh_pat');
  if (!pat) { pat = window.prompt('GitHub personal access token (needs "repo" scope):'); if (pat) localStorage.setItem('gh_pat', pat.trim()); }
  return pat ? pat.trim() : null;
}
async function getValidPat() {
  for (let i = 0; i < 3; i++) {
    const pat = getPat(); if (!pat) return null;
    setStatus('Checking token…');
    const res = await fetch('https://api.github.com/user', { headers: ghHeaders(pat) }).catch(() => null);
    if (res && res.ok) return pat;
    localStorage.removeItem('gh_pat');
    window.alert('Token rejected — try a fresh one.');
  }
  setStatus('Cancelled.', true); return null;
}

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return '📄';
  if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '🖼';
  if (['mp3','wav','flac','aac','ogg','m4a'].includes(ext)) return '🎵';
  return '📎';
}

async function loadApproverFiles(approverName, idx) {
  if (!approvalsBase) return;
  const folderPath = `${approvalsBase}/${sanitizeFolderName(approverName)}`;
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${folderPath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const items = await res.json();
    if (!Array.isArray(items)) return;
    const files = items.filter(f => f.type === 'file' && !f.name.startsWith('.'));
    if (!files.length) return;
    const container = document.getElementById(`afiles-${idx}`);
    if (!container) return;
    files.forEach(f => {
      const ext = f.name.includes('.') ? '.' + f.name.split('.').pop().toUpperCase() : f.name;
      const a = document.createElement('a');
      a.href = f.download_url;
      a.className = 'approver-file-chip';
      a.textContent = `${fileIcon(f.name)} ${ext}`;
      a.addEventListener('click', e => { e.preventDefault(); openFilePreview(f.name, f.download_url); });
      container.appendChild(a);
    });
  } catch(e) {}
}

/* ---- Inline file preview modal ---- */
let _previewObjectUrl = null;
function openFilePreview(fileName, url) {
  const overlay = document.getElementById('file-preview-overlay');
  const body    = document.getElementById('file-preview-body');
  const title   = document.getElementById('file-preview-title');
  const dl       = document.getElementById('file-preview-download');
  title.textContent = fileName;
  dl.href = url;
  dl.setAttribute('download', fileName);
  body.innerHTML = '<div class="file-preview-loading">loading…</div>';
  overlay.classList.add('open');
  const ext = (fileName.split('.').pop() || '').toLowerCase();
  const isImg = ['jpg','jpeg','png','gif','webp','bmp','svg','avif'].includes(ext);
  if (isImg) {
    const img = document.createElement('img');
    img.className = 'file-preview-img';
    img.alt = fileName;
    img.onload  = () => { body.innerHTML = ''; body.appendChild(img); };
    img.onerror = () => { body.innerHTML = `<div class="file-preview-loading">Couldn't preview this file. <a href="${url}" download="${fileName}">Download instead</a></div>`; };
    img.src = url;
    return;
  }
  /* PDFs (and other embeddable docs) — raw serves as octet-stream, so fetch the
     bytes and rebuild a blob with the correct MIME type for inline rendering. */
  const mime = ext === 'pdf' ? 'application/pdf' : 'text/plain';
  fetch(url)
    .then(r => { if (!r.ok) throw new Error(); return r.blob(); })
    .then(blob => {
      if (_previewObjectUrl) URL.revokeObjectURL(_previewObjectUrl);
      _previewObjectUrl = URL.createObjectURL(new Blob([blob], { type: mime }));
      const frame = document.createElement('iframe');
      frame.className = 'file-preview-frame';
      frame.src = _previewObjectUrl;
      body.innerHTML = '';
      body.appendChild(frame);
    })
    .catch(() => {
      body.innerHTML = `<div class="file-preview-loading">Couldn't preview this file. <a href="${url}" download="${fileName}">Download instead</a></div>`;
    });
}
function closeFilePreview() {
  const overlay = document.getElementById('file-preview-overlay');
  overlay.classList.remove('open');
  document.getElementById('file-preview-body').innerHTML = '';
  if (_previewObjectUrl) { URL.revokeObjectURL(_previewObjectUrl); _previewObjectUrl = null; }
}

async function loadAttachments() {
  if (!filesPath) return;
  attachList.innerHTML = '';
  attachInner.style.display = 'none';
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${filesPath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const items = await res.json();
    if (!Array.isArray(items)) return;
    const files = items.filter(f => f.type === 'file' && !f.name.startsWith('.'));
    if (!files.length) return;
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'attach-item';
      a.href = f.download_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<span class="attach-item-icon">${fileIcon(f.name)}</span><span class="attach-item-name">${f.name}</span>`;
      if (isEditing) {
        const del = document.createElement('button');
        del.className = 'attach-delete';
        del.textContent = '×';
        del.title = 'Delete file';
        del.addEventListener('click', async e => {
          e.preventDefault();
          e.stopPropagation();
          if (!confirm(`Delete "${f.name}"?`)) return;
          const pat = await getValidPat();
          if (!pat) return;
          const path = `${filesPath}/${f.name}`;
          const delRes = await fetch(
            `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`,
            { method: 'DELETE', headers: ghHeaders(pat), body: JSON.stringify({ message: `Remove attachment: ${f.name}`, sha: f.sha, branch: GH_BRANCH }) }
          );
          if (delRes.ok) loadAttachments();
        });
        a.appendChild(del);
      }
      attachList.appendChild(a);
    });
    attachInner.style.display = '';
  } catch(e) { /* folder doesn't exist yet */ }
}

loadAttachments();

/* ---- Preset forms (download from a shared account-level folder) ---- */
const formsPath    = `companies/EG Publishing/accounts/${username}/licensing/forms`;
const formsBtn     = document.getElementById('forms-btn');
const formsDropdown = document.getElementById('forms-dropdown');
let _formsLoaded = false;

async function loadForms() {
  formsDropdown.innerHTML = `<div class="forms-empty">loading…</div>`;
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${formsPath}?ref=${GH_BRANCH}`);
    if (!res.ok) { formsDropdown.innerHTML = `<div class="forms-empty">No forms available.</div>`; return; }
    const items = await res.json();
    const files = Array.isArray(items) ? items.filter(f => f.type === 'file' && !f.name.startsWith('.')) : [];
    if (!files.length) { formsDropdown.innerHTML = `<div class="forms-empty">No forms available.</div>`; return; }
    files.sort((a, b) => {
      const aSync = /sync/i.test(a.name), bSync = /sync/i.test(b.name);
      if (aSync && !bSync) return -1;
      if (!aSync && bSync) return 1;
      return a.name.localeCompare(b.name);
    });
    formsDropdown.innerHTML = `<div class="forms-dropdown-label">preset forms</div>`;
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'forms-item';
      a.href = f.download_url;
      a.setAttribute('download', f.name);
      a.innerHTML = `<span class="forms-item-icon">${fileIcon(f.name)}</span><span class="forms-item-name">${f.name.replace(/\.[^.]+$/, '')}</span>`;
      a.addEventListener('click', e => { e.preventDefault(); downloadForm(f.name, f.download_url); });
      formsDropdown.appendChild(a);
    });
  } catch(e) { formsDropdown.innerHTML = `<div class="forms-empty">Couldn't load forms.</div>`; }
}

function prefillFields() {
  const now = new Date();
  // Parse issued date (M/DD/YYYY) or fall back to today
  const issuedMatch = (cur.issued || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const effectiveDate = issuedMatch
    ? new Date(parseInt(issuedMatch[3]), parseInt(issuedMatch[1]) - 1, parseInt(issuedMatch[2]))
    : now;
  const monthDay = effectiveDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const year = effectiveDate.getFullYear().toString();
  const todayShort = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}/${now.getFullYear()}`;
  const licenseeVal = cur.licensee !== '—' ? cur.licensee : '';

  return {
    effective_date_month_day: monthDay,
    effective_date_year_yy:   year,
    composition_title:        track,
    credit_song_title:        track,
    recording_artist:         artist,
    credit_artist:            artist,
    publisher_name:           artist,
    master_owner_name:        artist,
    sig_publisher_company:    artist,
    sig_master_owner_company: artist,
    producer_name:            licenseeVal,
    sig_producer_company:     licenseeVal,
    sig_publisher_date:       todayShort,
    sig_master_owner_date:    todayShort,
    sig_producer_date:        todayShort,
  };
}

async function downloadForm(fileName, url) {
  const statusEl = document.getElementById('upload-status');
  function st(msg, err) {
    statusEl.textContent = msg;
    statusEl.style.color = err ? '#e0667a' : 'var(--muted)';
  }

  st('preparing form…');
  formsDropdown.classList.remove('open');

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`fetch failed (${res.status})`);
    const arrayBuffer = await res.arrayBuffer();

    if (!window.PDFLib) throw new Error('pdf-lib not loaded');

    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
    const form = pdfDoc.getForm();
    const fills = prefillFields();
    for (const [fieldName, value] of Object.entries(fills)) {
      if (!value) continue;
      try { form.getTextField(fieldName).setText(value); } catch(_) {}
    }
    const filledBytes = await pdfDoc.save();
    const blob = new Blob([filledBytes], { type: 'application/pdf' });
    const outName = fileName.replace(/(\.[^.]+)$/, ' (Prefilled)$1');
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl; a.download = outName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
    st('downloaded ✓');
    setTimeout(() => st(''), 2500);
  } catch(e) {
    st(`failed: ${e.message}`, true);
    setTimeout(() => st(''), 3000);
  }
}

formsBtn.addEventListener('click', e => {
  e.stopPropagation();
  const willOpen = !formsDropdown.classList.contains('open');
  formsDropdown.classList.toggle('open', willOpen);
  if (willOpen && !_formsLoaded) { _formsLoaded = true; loadForms(); }
});
document.addEventListener('click', () => formsDropdown.classList.remove('open'));
formsDropdown.addEventListener('click', e => e.stopPropagation());
