<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — license detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="trakdb.ico">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#505050;--dim:#303030;
  --accent:#8b76ff;--accent-d:rgba(139,118,255,.14);--accent-g:rgba(139,118,255,.28);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --green:#4cc38a;--green-d:rgba(76,195,138,.12);
  --red:#e0667a;--red-d:rgba(224,102,122,.12);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(139,118,255,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

.topnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;align-items:center}
.topnav-link{font-size:14px;color:var(--muted);text-decoration:none;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s}
.topnav-link:hover,.topnav-link.active{color:var(--text)}

header{padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px var(--accent-g);flex-shrink:0;text-decoration:none}
.logo-mark svg{color:#fff}
.logo-name{font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);font-family:'Geist Mono',monospace;text-decoration:none}
.logo-name em{font-style:normal;color:var(--accent)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}

.back-link{position:absolute;top:110px;right:0;display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-decoration:none;transition:color .15s;z-index:2}
.back-link:hover{color:var(--text)}
.back-link svg{width:14px;height:14px}

.detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;margin-top:44px}
.detail-card-header{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px}
.detail-header-name{margin-left:auto;margin-right:auto;display:flex;align-items:center;gap:10px}.detail-header-name-val{font-size:22px;font-weight:500;color:var(--text)}
.detail-header-status{flex-shrink:0}
.detail-card-header-avatar{width:52px;height:52px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--card-h);border:1px solid var(--border)}
.detail-card-header-avatar img{width:100%;height:100%;object-fit:cover}
.detail-track-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.detail-track{font-size:22px;font-weight:600;letter-spacing:-.3px}
.play-btn{width:30px;height:30px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s;padding:0}
.play-btn:hover{opacity:.8}
.play-btn svg{color:#fff;width:13px;height:13px}
.detail-artist{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.detail-rows{padding:8px 0}
.detail-row{display:flex;align-items:center;padding:14px 28px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);width:120px;flex-shrink:0;letter-spacing:.3px;text-transform:uppercase}
.detail-val{font-size:14px;color:var(--text)}
.detail-input{flex:1;background:var(--card-h);border:1px solid var(--border-b);border-radius:8px;padding:7px 11px;font-size:14px;color:var(--text);font-family:'Geist',system-ui,sans-serif;outline:none;transition:border-color .15s}
.detail-input:focus{border-color:var(--accent)}
.detail-textarea{resize:vertical;min-height:64px;line-height:1.5}
.edit-actions{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--border);min-height:60px}
.edit-save{background:var(--accent);color:#fff;border:1px solid transparent;border-radius:8px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:opacity .15s}
.edit-save:hover{opacity:.8}
.edit-cancel{background:transparent;color:var(--muted);border:1px solid var(--border-b);border-radius:8px;padding:8px 18px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s}
.edit-cancel:hover{color:var(--text);border-color:var(--dim)}
.detail-header-right{display:flex;flex-direction:row;align-items:center;gap:10px;flex-shrink:0}
.edit-btn{background:transparent;border:1px solid var(--border-b);border-radius:8px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.edit-btn:hover{color:var(--text);border-color:var(--dim)}
.edit-status{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:0 28px 12px;min-height:14px}

.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.badge-active{background:var(--green-d);color:var(--green)}
.badge-pending{background:var(--gold-d);color:var(--gold)}
.badge-expired,.badge-denied{background:var(--red-d);color:var(--red)}
.badge-approved{background:var(--green-d);color:var(--green)}
.badge-type{background:var(--accent-d);color:var(--accent)}

.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#8b76ff);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:"JetBrains Mono",monospace}
.avatar:hover{opacity:.8}

footer{padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim)}

.attach-section{margin-bottom:48px}
.attach-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px}
.attach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.attach-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-size:13px;transition:background .15s,border-color .15s}
.attach-item:hover{background:var(--card-h);border-color:var(--border-b)}
.attach-delete{margin-left:auto;flex-shrink:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;transition:color .15s}
.attach-delete:hover{color:var(--red)}
.attach-item-icon{color:var(--muted);flex-shrink:0}
.attach-item-name{flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;background:transparent;border:1px dashed var(--border-b);border-radius:var(--radius);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.upload-row:hover{background:var(--card);color:var(--text);border-color:var(--accent-g)}
.upload-status{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;min-height:14px}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <a href="index.html" class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
          <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
          <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
          <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
        </svg>
      </a>
      <a href="index.html" class="logo-name">trak<em>db</em></a>
    </div>
    <nav class="topnav">
      <a href="index.html" class="topnav-link">home</a>
      <a href="music.html" class="topnav-link">music</a>
      <a href="licenses.html" class="topnav-link active">licenses</a>
      <a href="#" class="topnav-link">payments</a>
      <a href="tools.html" class="topnav-link">tools</a>
    </nav>
    <div class="avatar" title="profile">?</div>
  </header>

  <a href="licenses.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    back to licenses
  </a>

  <div class="section-header" style="display:none"><div class="section-title" id="page-kind">License</div></div>

  <div class="detail-card">
    <div class="detail-card-header">
      <div class="detail-card-header-avatar"><img id="artist-avatar" alt=""></div>
      <div>
        <div class="detail-track-row">
          <div class="detail-track" id="d-track">—</div>
          <button class="play-btn" id="play-btn" title="Play">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
        </div>
        <div class="detail-artist" id="d-artist">—</div>
      </div>
      <div class="detail-header-name" id="d-name-wrap" style="display:none">
        <div class="detail-header-name-val" id="d-name"></div>
        <div class="detail-header-status" id="d-status-wrap" style="display:none"></div>
      </div>
      <div class="detail-header-right" id="detail-header-right">
        <button class="edit-btn" id="edit-btn">edit</button>
      </div>
    </div>
    <div class="detail-rows" id="detail-rows"></div>
    <div id="attach-inner" style="display:none;border-top:1px solid var(--border);padding:12px 0">
      <div class="attach-list" id="attach-list" style="padding:0 28px"></div>
    </div>
  </div>

  <div style="margin-top:0" id="upload-wrap">
    <div class="upload-row" id="upload-row">+ upload files</div>
    <input type="file" id="upload-input" style="display:none">
    <div class="upload-status" id="upload-status"></div>
  </div>

  <footer>© 2026 trakdb</footer>
</div>
<script>
const params  = new URLSearchParams(location.search);
const kind    = params.get('kind') || 'license';
const isReq   = kind === 'request';
const artist  = params.get('artist')  || '—';
const track   = params.get('track')   || '—';
const name    = params.get('name')    || '';
const type    = params.get('type')    || '—';
const licensee = params.get('licensee') || '—';
const issued  = params.get('issued')  || '—';
const status  = params.get('status')  || '—';
const notes   = params.get('notes')   || '';

const session  = JSON.parse(localStorage.getItem('trakdb_session') || 'null') || { username: 'Admin1' };
const username = session.username;

document.title = `trakdb — ${track}`;
document.getElementById('page-kind').textContent = isReq ? 'Request' : 'License';
document.getElementById('d-track').textContent   = track;
document.getElementById('d-artist').textContent  = artist;
if (name) {
  document.getElementById('d-name').textContent = name;
  document.getElementById('d-name-wrap').style.display = '';
}
if (status) {
  const sw = document.getElementById('d-status-wrap');
  sw.innerHTML = statusBadge(status);
  sw.style.display = '';
}
document.getElementById('artist-avatar').src = `https://desousabrian.github.io/accounts/${username}/artists/${encodeURIComponent(artist)}/avatar.jpeg`;

function statusBadge(s) {
  const l = (s||'').trim().toLowerCase();
  const cls = l==='active'||l==='approved' ? 'badge-active' : l==='expired'||l==='denied' ? 'badge-expired' : 'badge-pending';
  return `<span class="badge ${cls}">${s}</span>`;
}

let cur = { type, licensee, issued, notes, status };
let isEditing = false;

function renderRows(editing) {
  const detailRows  = document.getElementById('detail-rows');
  const editBtn     = document.getElementById('edit-btn');
  const headerRight = document.getElementById('detail-header-right');
  const existing    = document.getElementById('edit-save-btn');
  if (existing) existing.remove();
  isEditing = editing;
  loadAttachments();
  const sw = document.getElementById('d-status-wrap');
  if (!editing) {
    sw.innerHTML = statusBadge(cur.status);
    editBtn.textContent = 'edit';
    const fields = [
      [isReq ? 'Requester' : 'Licensee', cur.licensee],
      ['Type',                             cur.type],
      [isReq ? 'Received'  : 'Issued',    cur.issued],
      ...(cur.notes ? [['Notes', cur.notes]] : []),
    ];
    detailRows.innerHTML = fields.map(([l, v]) =>
      `<div class="detail-row"><span class="detail-label">${l}</span><span class="detail-val">${v || '—'}</span></div>`
    ).join('');
  } else {
    editBtn.textContent = 'cancel';
    const saveBtn = document.createElement('button');
    saveBtn.id = 'edit-save-btn';
    saveBtn.className = 'edit-save';
    saveBtn.textContent = 'save';
    saveBtn.addEventListener('click', saveEdits);
    headerRight.insertBefore(saveBtn, editBtn);
    detailRows.innerHTML = `
      <div class="detail-row"><span class="detail-label">${isReq ? 'Requester' : 'Licensee'}</span><input class="detail-input" id="e-licensee" value="${cur.licensee}"></div>
      <div class="detail-row"><span class="detail-label">Type</span><select class="detail-input" id="e-type">${['Sync','Mechanical','Master','Print','Other'].map(o=>`<option${o===cur.type?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="detail-row"><span class="detail-label">${isReq ? 'Received' : 'Issued'}</span><input class="detail-input" id="e-issued" type="date" value="${cur.issued}"></div>
      <div class="detail-row" style="align-items:flex-start"><span class="detail-label" style="padding-top:6px">Notes</span><textarea class="detail-input detail-textarea" id="e-notes">${cur.notes}</textarea></div>`;
  }
}

renderRows(false);

document.getElementById('edit-btn').addEventListener('click', () => {
  const editing = document.getElementById('edit-btn').textContent === 'edit';
  renderRows(editing);
});

async function saveEdits() {
  if (!name) return;
  const saveBtn = document.getElementById('edit-save-btn');
  const statusEl = document.getElementById('upload-status');
  const newLicensee = document.getElementById('e-licensee').value.trim();
  const newType     = document.getElementById('e-type').value.trim();
  const newIssued   = document.getElementById('e-issued').value.trim();
  const newNotes    = document.getElementById('e-notes').value.trim();
  saveBtn.disabled = true;
  statusEl.textContent = 'saving…';
  try {
    const pat = await getValidPat();
    if (!pat) { saveBtn.disabled = false; statusEl.textContent = ''; return; }
    const csvFile = isReq ? 'request.csv' : 'license.csv';
    const csvPath = `accounts/${username}/${folderKind}/${name}/${csvFile}`;
    const apiUrl  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${csvPath}`;
    const fileRes = await fetch(apiUrl, { headers: ghHeaders(pat) });
    if (!fileRes.ok) throw new Error(`Could not fetch CSV (${fileRes.status})`);
    const fileJson = await fileRes.json();
    const existing = atob(fileJson.content.replace(/\n/g, ''));
    const lines = existing.split('\n').filter(l => l.trim());
    const header = lines[0] || 'Artist,Track,Type,Licensee,Issued,Status,Notes';
    const dataLine = lines[1] || '';
    function parseCSV(l) {
      const cols = []; let c = '', q = false;
      for (const ch of l) { if (ch==='"') q=!q; else if (ch===','&&!q){cols.push(c);c='';}else c+=ch; }
      cols.push(c); return cols;
    }
    function csvVal(v) { return v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g,'""')}"` : v; }
    const cols = parseCSV(dataLine);
    cols[2] = newType;
    cols[3] = newLicensee;
    cols[4] = newIssued;
    cols[5] = cols[5] || status;
    cols[6] = newNotes;
    const newData = cols.map(csvVal).join(',');
    const newContent = btoa(unescape(encodeURIComponent(`${header}\n${newData}\n`)));
    const putRes = await fetch(apiUrl, { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify({ message: `Update ${name}`, content: newContent, sha: fileJson.sha, branch: GH_BRANCH }) });
    if (!putRes.ok) { const e = await putRes.json().catch(()=>({})); throw new Error(e.message || `Save failed (${putRes.status})`); }
    cur = { type: newType, licensee: newLicensee, issued: newIssued, notes: newNotes };
    const p = new URLSearchParams(location.search);
    p.set('type', newType); p.set('licensee', newLicensee); p.set('issued', newIssued); p.set('notes', newNotes);
    history.replaceState(null, '', `?${p}`);
    renderRows(false);
    setStatus('saved ✓');
    setTimeout(() => setStatus(''), 2500);
  } catch(err) {
    setStatus(`failed: ${err.message}`, true);
    saveBtn.disabled = false;
  }
}

/* ---- Song lookup + play button ---- */
const GH_OWNER = 'desousabrian', GH_REPO = 'desousabrian.github.io', GH_BRANCH = 'main';
(async () => {
  const songsPath = `accounts/${username}/artists/${encodeURIComponent(artist)}/songs`;
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${songsPath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const files = await res.json();
    if (!Array.isArray(files)) return;
    const match = files.find(f => f.type === 'file' && f.name.replace(/\.[^.]+$/, '') === track);
    if (!match) return;
    const src = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${songsPath}/${encodeURIComponent(match.name)}`;
    const audio = new Audio();
    audio.preload = 'none';
    audio.src = src;
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    btn.style.display = 'flex';
    const pauseSVG = `<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>`;
    const playSVG  = `<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><polygon points="5,3 19,12 5,21"/></svg>`;
    btn.addEventListener('click', () => {
      if (audio.paused) { audio.play(); btn.innerHTML = pauseSVG; }
      else { audio.pause(); btn.innerHTML = playSVG; }
    });
    audio.addEventListener('ended', () => { btn.innerHTML = playSVG; });
  } catch(e) {}
})();

/* ---- Attachments ---- */
const folderKind = isReq ? 'requests' : 'licenses';
const filesPath  = name ? `accounts/${username}/${folderKind}/${name}/files` : null;

const attachInner   = document.getElementById('attach-inner');
const attachList    = document.getElementById('attach-list');
const uploadRow     = document.getElementById('upload-row');
const uploadInput   = document.getElementById('upload-input');
const uploadStatus  = document.getElementById('upload-status');
const uploadWrap    = document.getElementById('upload-wrap');

if (!filesPath) uploadWrap.style.display = 'none';

function ghHeaders(pat) {
  return { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' };
}
function arrayBufferToB64(buf) {
  const bytes = new Uint8Array(buf); let binary = ''; const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}
function setStatus(msg, isError) {
  uploadStatus.textContent = msg;
  uploadStatus.style.color = isError ? '#e0667a' : 'var(--muted)';
}
function getPat() {
  let pat = localStorage.getItem('gh_pat');
  if (!pat) { pat = window.prompt('GitHub personal access token (needs "repo" scope):'); if (pat) localStorage.setItem('gh_pat', pat.trim()); }
  return pat ? pat.trim() : null;
}
async function getValidPat() {
  for (let i = 0; i < 3; i++) {
    const pat = getPat(); if (!pat) return null;
    setStatus('Checking token…');
    const res = await fetch('https://api.github.com/user', { headers: ghHeaders(pat) }).catch(() => null);
    if (res && res.ok) return pat;
    localStorage.removeItem('gh_pat');
    window.alert('Token rejected — try a fresh one.');
  }
  setStatus('Cancelled.', true); return null;
}

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return '📄';
  if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '🖼';
  if (['mp3','wav','flac','aac','ogg','m4a'].includes(ext)) return '🎵';
  return '📎';
}

async function loadAttachments() {
  if (!filesPath) return;
  attachList.innerHTML = '';
  attachInner.style.display = 'none';
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${filesPath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const items = await res.json();
    if (!Array.isArray(items)) return;
    const files = items.filter(f => f.type === 'file' && !f.name.startsWith('.'));
    if (!files.length) return;
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'attach-item';
      a.href = f.download_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<span class="attach-item-icon">${fileIcon(f.name)}</span><span class="attach-item-name">${f.name}</span>`;
      if (isEditing) {
        const del = document.createElement('button');
        del.className = 'attach-delete';
        del.textContent = '×';
        del.title = 'Delete file';
        del.addEventListener('click', async e => {
          e.preventDefault();
          e.stopPropagation();
          if (!confirm(`Delete "${f.name}"?`)) return;
          const pat = await getValidPat();
          if (!pat) return;
          const path = `${filesPath}/${f.name}`;
          const delRes = await fetch(
            `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`,
            { method: 'DELETE', headers: ghHeaders(pat), body: JSON.stringify({ message: `Remove attachment: ${f.name}`, sha: f.sha, branch: GH_BRANCH }) }
          );
          if (delRes.ok) loadAttachments();
        });
        a.appendChild(del);
      }
      attachList.appendChild(a);
    });
    attachInner.style.display = '';
  } catch(e) { /* folder doesn't exist yet */ }
}

loadAttachments();

uploadRow.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', async () => {
  const file = uploadInput.files[0];
  uploadInput.value = '';
  if (!file || !filesPath) return;
  const pat = await getValidPat();
  if (!pat) return;
  try {
    setStatus('Reading file…');
    const buf = await file.arrayBuffer();
    setStatus('uploading…');
    const path = `${filesPath}/${file.name}`;
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`,
      { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify({ message: `Attach file to license: ${name}`, content: arrayBufferToB64(buf), branch: GH_BRANCH }) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || `Upload failed (${res.status})`); }
    setStatus('uploaded ✓');
    loadAttachments();
  } catch(err) { setStatus(`Failed: ${err.message}`, true); }
});
</script>
<style>
.avatar-wrap{position:relative;margin-left:auto;flex-shrink:0}
.avatar-wrap .avatar{margin-left:0}
.avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:10px;padding:8px 0;min-width:160px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.avatar-menu.open{display:block}
.avatar-menu-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:6px 14px 10px;letter-spacing:.3px}
.avatar-menu-item{display:block;width:100%;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);background:none;border:none;text-align:left;cursor:pointer;transition:background .1s}
.avatar-menu-item:hover{background:var(--card-h)}
</style>
<script>
(function(){
  const el = document.querySelector('.avatar');
  if (!el) return;
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  const session = JSON.parse(localStorage.getItem('trakdb_session') || 'null');
  if (session) {
    el.innerHTML = '';
    el.style.background = 'none';
    const img = document.createElement('img');
    img.src = session.avatar;
    img.alt = session.username;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    el.appendChild(img);
    el.title = session.username;
    const menu = document.createElement('div');
    menu.className = 'avatar-menu';
    menu.innerHTML = `<div class="avatar-menu-name">${session.username}</div><button class="avatar-menu-item" id="logout-btn">log out</button>`;
    wrap.appendChild(menu);
    el.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click', () => menu.classList.remove('open'));
    menu.querySelector('#logout-btn').addEventListener('click', () => { localStorage.removeItem('trakdb_session'); location.href = 'login.html'; });
  } else {
    el.addEventListener('click', () => location.href = 'login.html');
    el.title = 'log in';
    document.querySelectorAll('.topnav-link').forEach(l => {
      if (['music','licenses','payments'].includes(l.textContent.trim())) l.href = 'features.html';
    });
  }
})();
</script>
