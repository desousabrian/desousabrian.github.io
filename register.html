<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="trakdb1.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#646464;--dim:#3c3c3c;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);
  font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}

.login-wrap{
  position:relative;z-index:1;
  width:100%;max-width:380px;padding:24px;
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:36px;justify-content:center}
.logo-mark{
  width:34px;height:34px;background:#295ad6;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:none;flex-shrink:0;text-decoration:none;
}
.logo-name{
  font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);
  font-family:'Geist Mono',monospace;text-decoration:none;
}
.logo-name em{font-style:normal;color:#6285e4}

.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:32px;display:flex;flex-direction:column;gap:20px;
}
.login-title{
  font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--muted);letter-spacing:.8px;text-transform:uppercase;
}
.field input{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;color:var(--text);font-family:'Geist',sans-serif;font-size:14px;
  outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--accent)}
.login-btn{
  width:100%;padding:11px 0;background:var(--accent);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  border:none;border-radius:10px;cursor:pointer;
  box-shadow:0 0 24px var(--accent-g);transition:opacity .15s;letter-spacing:.3px;
}
.login-btn:hover{opacity:.85}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:#e0667a;text-align:center;min-height:16px;
}
.login-alt{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--muted);text-align:center;margin-top:-4px;
}
.login-alt a{color:var(--accent);text-decoration:none}
.login-alt a:hover{text-decoration:underline}

:root[data-theme="light"]{--bg:#f4f6f9;--surface:#ffffff;--card:#ffffff;--card-h:#eceff4;--border:#e4e8ee;--border-b:#d2d8e0;--text:#1b1e23;--muted:#5c6470;--dim:#9299a4;}
:root[data-theme="light"] body{background:radial-gradient(130% 100% at 50% 0%,#e8edf6 0%,var(--bg) 60%) fixed;}
:root[data-theme="light"] .orb{opacity:.55}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('trakdb_settings')||'{}');if(s.theme==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-wrap">
  <div class="login-logo">
    <a href="index.html" class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
        <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
        <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
        <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
      </svg>
    </a>
    <a href="index.html" class="logo-name">trak<em>db</em></a>
  </div>

  <div class="login-card">
    <div class="login-title">Create account</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="r-username" autocomplete="username" placeholder="Username">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="r-email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="r-password" autocomplete="new-password" placeholder="Password">
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" id="r-confirm" autocomplete="new-password" placeholder="Confirm password">
    </div>
    <div class="login-error" id="reg-error"></div>
    <button class="login-btn" id="reg-btn">create account</button>
    <div class="login-alt">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script>
/* NOTE: accounts live in company/EG Publishing/accounts/logins.csv — demo-grade only.
   Registration appends a row to that CSV via a GitHub token (repo scope). */
const GH_OWNER = 'desousabrian', GH_REPO = 'desousabrian.github.io', GH_BRANCH = 'main';
const CSV_PATH = 'company/EG Publishing/accounts/logins.csv';
const $ = id => document.getElementById(id);
const errEl = $('reg-error'), btn = $('reg-btn');

function ghHeaders(pat) { return { Authorization: `token ${pat}`, 'Content-Type': 'application/json' }; }
function utf8ToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64ToUtf8(s) { return decodeURIComponent(escape(atob(s))); }
function reset() { btn.disabled = false; btn.textContent = 'create account'; }
async function getPat() {
  let pat = localStorage.getItem('gh_pat') || '';
  if (!pat) { pat = prompt('Enter a GitHub personal access token (repo scope):') || ''; if (pat) localStorage.setItem('gh_pat', pat.trim()); }
  return pat ? pat.trim() : '';
}

async function register() {
  errEl.textContent = '';
  const username = $('r-username').value.trim();
  const email    = $('r-email').value.trim();
  const password = $('r-password').value;
  const confirm  = $('r-confirm').value;

  if (!username) { errEl.textContent = 'Please enter a username.'; $('r-username').focus(); return; }
  if (username.includes(',')) { errEl.textContent = 'Username can’t contain a comma.'; return; }
  if (!email) { errEl.textContent = 'Please enter an email.'; $('r-email').focus(); return; }
  if (!password) { errEl.textContent = 'Please enter a password.'; $('r-password').focus(); return; }
  if (password !== confirm) { errEl.textContent = 'Passwords don’t match.'; $('r-confirm').focus(); return; }

  btn.disabled = true; btn.textContent = 'creating…';
  const pat = await getPat();
  if (!pat) { errEl.textContent = 'A GitHub token is required to register.'; reset(); return; }

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${CSV_PATH}?ref=${GH_BRANCH}`, { headers: ghHeaders(pat) });
    if (!res.ok) throw new Error('Could not reach the accounts service.');
    const j = await res.json();
    const csv = b64ToUtf8(j.content.replace(/\n/g, ''));
    const lines = csv.split('\n');
    const taken = lines.slice(1).map(l => (l.split(',')[0] || '').trim().toLowerCase()).filter(Boolean);
    if (taken.includes(username.toLowerCase())) { errEl.textContent = 'That username is already taken.'; reset(); return; }

    const newCsv = csv.trimEnd() + '\n' + `${username},${password},${email}` + '\n';
    const put = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${CSV_PATH}`, {
      method: 'PUT', headers: ghHeaders(pat),
      body: JSON.stringify({ message: `Register account: ${username}`, content: utf8ToB64(newCsv), sha: j.sha, branch: GH_BRANCH })
    });
    if (!put.ok) { const e = await put.json().catch(() => ({})); throw new Error(e.message || 'Registration failed.'); }
    btn.textContent = 'account created ✓';
    setTimeout(() => { location.href = 'login.html'; }, 1000);
  } catch (e) {
    errEl.textContent = e.message || 'Registration failed.';
    reset();
  }
}

btn.addEventListener('click', register);
['r-username','r-email','r-password','r-confirm'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') register(); })
);
</script>
</body>
</html>
