<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#646464;--dim:#3c3c3c;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --green:#4ade80;--green-d:rgba(74,222,128,.12);
  --red:#e0667a;--red-d:rgba(224,102,122,.12);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

.topnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;align-items:center}
.topnav-link{font-size:14px;color:var(--muted);text-decoration:none;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s}
.topnav-link:hover,.topnav-link.active{color:var(--text)}

header{padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:#295ad6;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:none;flex-shrink:0;text-decoration:none}
.logo-name{font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);font-family:'Geist Mono',monospace;text-decoration:none}
.logo-name em{font-style:normal;color:#6285e4}

.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:'JetBrains Mono',monospace}
.avatar:hover{opacity:.8}

.section{margin-bottom:48px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;min-height:30px}
.section-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.section-count{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px}

.list-table{width:100%;border-collapse:collapse;table-layout:fixed}
.list-table col.c-artist{width:14%}.list-table col.c-track{width:19%}.list-table col.c-name{width:18%}.list-table col.c-type{width:10%}.list-table col.c-party{width:15%}.list-table col.c-date{width:12%}.list-table col.c-status{width:12%}
.list-table th{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;text-align:left;padding:9px 16px;font-weight:400}
.list-table thead tr{transition:background .12s;cursor:default;border-bottom:1px solid var(--border)}
.list-table thead tr:hover{background:#0d0d0d}
.list-table th:nth-child(n+4),.list-table td:nth-child(n+4){text-align:center}
.list-row{border-top:1px solid var(--border);transition:background .12s;cursor:default}
.list-row:hover{background:var(--card)}
.list-row td{padding:14px 16px;vertical-align:middle}

.row-title{font-size:14px;font-weight:500}
.row-sub{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.badge-active{background:var(--green-d);color:var(--green)}
.badge-pending{background:var(--gold-d);color:var(--gold)}
.badge-expired{background:var(--red-d);color:var(--red)}
.badge-type{background:var(--accent-d);color:var(--accent)}
.badge-type-mech{background:var(--cyan-d);color:var(--cyan)}

.empty-state{padding:40px 0;text-align:center;border-top:1px solid var(--border)}
.empty-state-text{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim)}

.status-wrap{position:relative;display:inline-block}
.status-wrap .badge{cursor:pointer;user-select:none}
.status-wrap .badge:hover{opacity:.8}
.modal .status-wrap .badge{padding:7px 12px;font-size:12px;border-radius:8px;letter-spacing:normal}
.status-dropdown{display:none;position:absolute;top:calc(100% + 5px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:8px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:100px}
.status-dropdown.open{display:block}
.status-option{padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap}
.status-option:hover{background:var(--card-h)}
.status-option-renew{color:var(--cyan);border-top:1px solid var(--border)}
@keyframes row-approve{0%{background:transparent}30%{background:rgba(80,200,120,.15)}80%{background:rgba(80,200,120,.12)}100%{background:transparent;opacity:0;transform:translateX(24px)}}
.row-approving{animation:row-approve .9s ease forwards;pointer-events:none}

footer{padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;transition:color .15s;border-radius:6px;flex-shrink:0}
.search-btn:hover{color:var(--text)}
.search-input{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);width:0;opacity:0;overflow:hidden;background:var(--surface);border:1px solid transparent;border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;padding:0;transition:width .2s ease,opacity .2s ease,padding .2s ease,border-color .2s ease;outline:none;white-space:nowrap}
.search-wrap.open .search-input{width:160px;opacity:1;padding:4px 10px;border-color:var(--border-b)}
.search-wrap.open .search-input:focus{border-color:var(--accent)}
</style>
</head>

<script>
const session  = JSON.parse(localStorage.getItem('trakdb_session') || 'null') || { username: 'Admin1' };
const username = session.username;

function parseCSVRow(line) {
  const cols = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  cols.push(cur.trim());
  return cols;
}

const LICENSE_STATUSES = ['Active','Pending','Expired','Renew'];
const REQUEST_STATUSES = ['Pending','Approved','Denied'];

function statusClass(s) {
  const l = (s||'').trim().toLowerCase();
  return l === 'active' ? 'badge-active' : l === 'expired' || l === 'denied' ? 'badge-expired' : 'badge-pending';
}

function statusBadge(status) {
  const label = status?.trim() || 'Pending';
  return `<span class="badge ${statusClass(label)}">${label}</span>`;
}

function makeDetailUrl(kind, cols, name) {
  const p = new URLSearchParams({ kind, artist: cols[0]||'', track: cols[1]||'', name: name||'', type: cols[2]||'', licensee: cols[3]||'', issued: cols[4]||'', status: cols[5]||'', notes: cols[6]||'', approvers: cols[7]||'' });
  return `license-detail.html?${p}`;
}

function attachRowClick(tr, kind, cols, name) {
  tr.style.cursor = 'pointer';
  tr.addEventListener('click', e => {
    if (e.target.closest('.status-wrap')) return;
    location.href = makeDetailUrl(kind, cols, name);
  });
}

function renderLicenseRow(cols, csvPath) {
  const tbody = document.getElementById('license-list');
  if (!tbody) return;
  const pathParts = csvPath.split('/');
  const folderName = pathParts[pathParts.length - 2] || '';
  const tr = document.createElement('tr');
  tr.className = 'list-row';
  tr.innerHTML = `
    <td><div class="row-title">${cols[0] || '—'}</div></td>
    <td><div class="row-title">${cols[1] || '—'}</div></td>
    <td><div class="row-sub">${folderName || '—'}</div></td>
    <td>${typeBadge(cols[2])}</td>
    <td><div class="row-sub">${cols[3] || '—'}</div></td>
    <td><div class="row-sub">${cols[4] || '—'}</div></td>
    <td>${statusBadge(cols[5])}</td>
  `;
  tbody.appendChild(tr);
  attachStatusDropdown(tr.lastElementChild, csvPath, 0, tr, cols);
  attachRowClick(tr, 'license', cols, folderName);
  const countEl = document.getElementById('license-count');
  if (countEl) countEl.textContent = tbody.querySelectorAll('tr').length;
}

function attachStatusDropdown(cell, csvPath, rowIdx, tr, cols) {
  const badge = cell.querySelector('.badge');
  if (!badge) return;
  const isRequests = csvPath.includes('/requests/');
  const options = isRequests ? REQUEST_STATUSES : LICENSE_STATUSES;

  const wrap = document.createElement('div');
  wrap.className = 'status-wrap';
  cell.innerHTML = '';
  cell.appendChild(wrap);
  wrap.appendChild(badge);

  const dropdown = document.createElement('div');
  dropdown.className = 'status-dropdown';
  dropdown.innerHTML = options.map(o => `<div class="status-option${o === 'Renew' ? ' status-option-renew' : ''}">${o}</div>`).join('');
  wrap.appendChild(dropdown);

  badge.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.status-dropdown.open').forEach(d => { if (d !== dropdown) d.classList.remove('open'); });
    dropdown.classList.toggle('open');
  });
  document.addEventListener('click', () => dropdown.classList.remove('open'));

  dropdown.querySelectorAll('.status-option').forEach(opt => {
    opt.addEventListener('click', async e => {
      e.stopPropagation();
      dropdown.classList.remove('open');
      const newStatus = opt.textContent.trim();
      if (newStatus === badge.textContent.trim()) return;

      if (!isRequests && newStatus === 'Renew') {
        const d = new Date();
        const todayFmt = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
        cols[4] = todayFmt;
        cols[5] = 'Active';
        const issuedCell = tr.cells[4];
        if (issuedCell) issuedCell.innerHTML = `<div class="row-sub">${todayFmt}</div>`;
        badge.textContent = 'Active';
        badge.className = `badge ${statusClass('Active')}`;
        try {
          const pat = await getValidPat(() => {});
          if (!pat) return;
          const file = await ghGetFile(pat, csvPath);
          const src = b64ToUtf8(file.content);
          const lines = src.split('\n');
          const dataIdx = rowIdx + 1;
          if (lines[dataIdx] !== undefined) {
            const rowCols = parseCSVRow(lines[dataIdx]);
            rowCols[4] = todayFmt;
            rowCols[5] = 'Active';
            lines[dataIdx] = rowCols.map(v => v.includes(',') ? `"${v}"` : v).join(',');
            await ghPutFile(pat, csvPath, lines.join('\n'), file.sha, `Renew license row ${rowIdx + 1}`);
          }
        } catch(err) { console.error(err); }
        return;
      }

      badge.textContent = newStatus;
      badge.className = `badge ${statusClass(newStatus)}`;

      if (isRequests && newStatus === 'Approved') {
        /* Animate row out, then move to licenses */
        tr.classList.add('row-approving');
        tr.addEventListener('animationend', () => {
          tr.remove();
          const countEl = document.getElementById('request-count');
          if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent || '0') - 1);
          const licCols = [...cols];
          licCols[5] = 'Active';
          renderLicenseRow(licCols);
        }, { once: true });

        try {
          const pat = await getValidPat(() => {});
          if (!pat) return;
          /* Mark request as Approved in its own CSV */
          const reqFile = await ghGetFile(pat, csvPath);
          const reqLines = b64ToUtf8(reqFile.content).split('\n');
          if (reqLines[1] !== undefined) {
            const reqCols = parseCSVRow(reqLines[1]); reqCols[5] = 'Approved';
            reqLines[1] = reqCols.map(v => v.includes(',') ? `"${v}"` : v).join(',');
            await ghPutFile(pat, csvPath, reqLines.join('\n'), reqFile.sha, `Approve request: ${cols[0]} – ${cols[1]}`);
          }
          /* Create new license folder+CSV */
          const d = new Date();
          const todayFmt = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
          const licCols = [...cols]; licCols[4] = todayFmt; licCols[5] = 'Active';
          const folderName = `${cols[0]} - ${cols[1]}`.replace(/[/\\:*?"<>|]/g, '-');
          const licCsvPath = `accounts/${username}/licensing/licenses/${folderName}/license.csv`;
          const licContent = `Artist,Track,Type,Licensee,Issued,Status\n${licCols.map(v => v.includes(',') ? `"${v}"` : v).join(',')}\n`;
          await ghPutFile(pat, licCsvPath, licContent, null, `Move approved request to licenses: ${cols[0]} – ${cols[1]}`);
          renderLicenseRow(licCols, licCsvPath);
        } catch(err) { console.error(err); }
        return;
      }

      try {
        const pat = await getValidPat(() => {});
        if (!pat) return;
        const file = await ghGetFile(pat, csvPath);
        const src = b64ToUtf8(file.content);
        const lines = src.split('\n');
        const dataIdx = rowIdx + 1;
        if (lines[dataIdx] !== undefined) {
          const rowCols = parseCSVRow(lines[dataIdx]);
          rowCols[5] = newStatus;
          lines[dataIdx] = rowCols.map(v => v.includes(',') ? `"${v}"` : v).join(',');
          await ghPutFile(pat, csvPath, lines.join('\n'), file.sha, `Update status for row ${rowIdx + 1}`);
        }
      } catch(err) { console.error(err); }
    });
  });
}

const GH_OWNER = 'desousabrian', GH_REPO = 'desousabrian.github.io', GH_BRANCH = 'main';

async function loadTable(basePath, csvFilename, tbodyId, countId) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${basePath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const items = await res.json();
    if (!Array.isArray(items)) return;
    const folders = items.filter(i => i.type === 'dir' && !i.name.startsWith('.'));
    if (!folders.length) return;
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    const isReq = csvFilename === 'request.csv';
    let count = 0;
    for (const folder of folders) {
      const csvPath = `${basePath}/${folder.name}/${csvFilename}`;
      const csvRes = await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${csvPath}`);
      if (!csvRes.ok) continue;
      const text = (await csvRes.text()).trim();
      const lines = text.split('\n').filter(l => l.trim() && !l.trim().match(/^,+$/));
      if (lines.length < 2) continue;
      const cols = parseCSVRow(lines[1]);
      if (!cols[0]) continue;
      const tr = document.createElement('tr');
      tr.className = 'list-row';
      tr.innerHTML = `
        <td><div class="row-title">${cols[0] || '—'}</div></td>
        <td><div class="row-title">${cols[1] || '—'}</div></td>
        <td><div class="row-sub">${folder.name || '—'}</div></td>
        <td>${typeBadge(cols[2])}</td>
        <td><div class="row-sub">${cols[3] || '—'}</div></td>
        <td><div class="row-sub">${cols[4] || '—'}</div></td>
        <td>${statusBadge(cols[5])}</td>
      `;
      tbody.appendChild(tr);
      attachStatusDropdown(tr.lastElementChild, csvPath, 0, tr, cols);
      attachRowClick(tr, isReq ? 'request' : 'license', cols, folder.name);
      count++;
    }
    document.getElementById(countId).textContent = count;
  } catch(e) { console.error(e); }
}

async function loadForms() {
  const listEl = document.getElementById('forms-list');
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/accounts/${username}/licensing/forms?ref=${GH_BRANCH}`);

    if (!files.length) return;
    files.sort((a, b) => {
      const aSync = /sync/i.test(a.name), bSync = /sync/i.test(b.name);
      if (aSync && !bSync) return -1;
      if (!aSync && bSync) return 1;
      return a.name.localeCompare(b.name);
    });
    listEl.innerHTML = '';
    files.forEach(f => {

/* Force a real download with the correct filename (the `download` attribute is
   ignored cross-origin, so fetch the bytes and save via a temporary link). */
async function downloadForm(fileName, url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
  } catch(e) { window.open(url, '_blank', 'noopener'); }
}

/* ---- GitHub API helpers ---- */
const ghHeaders = pat => ({ 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' });
const utf8ToB64 = str => { const b = new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const b64ToUtf8 = b64 => { const bin=atob(b64.replace(/\n/g,'')); const b=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(b); };

function getPat() {
  let p = localStorage.getItem('gh_pat');
  if (!p) { p = window.prompt('GitHub personal access token (repo scope):'); if (p) localStorage.setItem('gh_pat', p.trim()); }
  return p ? p.trim() : null;
}
async function getValidPat(setStatus) {
  for (let i = 0; i < 3; i++) {
    const p = getPat(); if (!p) return null;
    setStatus('Checking token…');
    const r = await fetch('https://api.github.com/user', { headers: ghHeaders(p) }).catch(() => null);
    if (r?.ok) return p;
    localStorage.removeItem('gh_pat');
    window.alert(r?.status === 401 ? 'Token invalid or expired. Try again.' : `GitHub rejected token (${r?.status}).`);
  }
  setStatus('Cancelled.', true); return null;
}
async function ghGetFile(pat, path) {
  const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`, { headers: ghHeaders(pat) });
  if (!r.ok) { if (r.status===401||r.status===403) localStorage.removeItem('gh_pat'); throw new Error(`Fetch failed (${r.status})`); }
  return r.json();
}
async function ghPutFile(pat, path, content, sha, message) {
  const body = { message, content: utf8ToB64(content), branch: GH_BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { method:'PUT', headers: ghHeaders(pat), body: JSON.stringify(body) });
  if (!r.ok) { if (r.status===401||r.status===403) localStorage.removeItem('gh_pat'); const e=await r.json().catch(()=>({})); throw new Error(e.message||`Commit failed (${r.status})`); }
  return r.json();
}

async function loadTracksForArtist(artistName) {
  if (!artistName) return [];

  try {

      `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/accounts/${username}/artists/${encodeURIComponent(artistName)}/songs?ref=${GH_BRANCH}`
    );

      ? files.filter(f => f.type === 'file' && !f.name.startsWith('.')).map(f => f.name.replace(/\.[^.]+$/, ''))
      : [];
  } catch(e) { _tracksByArtist[artistName] = []; }
  return _tracksByArtist[artistName];

function attachSuggest(input, getOptions) {
  const wrap = document.createElement('div');
  wrap.className = 'suggest-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const dropdown = document.createElement('div');
  dropdown.className = 'suggest-dropdown';
  wrap.appendChild(dropdown);

  let activeIdx = -1;

  async function render() {
    const q = input.value.trim().toLowerCase();
    const opts = await getOptions();
    const filtered = q ? opts.filter(o => o.toLowerCase().includes(q)) : opts;
    if (!filtered.length) { dropdown.style.display = 'none'; return; }
    activeIdx = -1;
    dropdown.innerHTML = filtered.slice(0, 8).map(o => `<div class="suggest-item">${o}</div>`).join('');
    dropdown.style.display = 'block';
    dropdown.querySelectorAll('.suggest-item').forEach(item => {
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value = item.textContent;
        dropdown.style.display = 'none';
        input.dispatchEvent(new Event('suggest'));
      });
    });
  }

  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 150));
  input.addEventListener('keydown', e => {
    const items = [...dropdown.querySelectorAll('.suggest-item')];
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, items.length-1); items.forEach((el,i) => el.classList.toggle('active', i===activeIdx)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); items.forEach((el,i) => el.classList.toggle('active', i===activeIdx)); }
    else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); input.value = items[activeIdx].textContent; dropdown.style.display = 'none'; input.dispatchEvent(new Event('suggest')); }
    else if (e.key === 'Escape') { dropdown.style.display = 'none'; }
  });
}

  if (licenseeInput)  attachSuggest(licenseeInput,  loadLicenseeNames);

  if (trackInput) {

      trackInput.value = '';
      loadTracksForArtist(artistInput.value.trim());
    });

    });

}

  btn.addEventListener('click', e => {
    e.stopPropagation();
    const opening = !wrap.classList.contains('open');
    if (opening) _searchInstances.forEach(s => { if (s.wrap !== wrap) s.close(); });
    wrap.classList.toggle('open', opening);
    if (opening) setTimeout(() => input.focus(), 50);
    else close();
  });

  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  input.addEventListener('input', () => applyFilter(input.value));
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) close(); });

  function applyFilter(q) {
    const term = q.trim().toLowerCase();
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    tbody.querySelectorAll('tr.list-row').forEach(row => {
      row.style.display = (!term || row.textContent.toLowerCase().includes(term)) ? '' : 'none';
    });
  }
}

attachTableSearch('search-wrap', 'search-btn', 'search-input', 'license-list');
attachTableSearch('req-search-wrap', 'req-search-btn', 'req-search-input', 'request-list');

(function(){
  const el = document.querySelector('.avatar');
  if (!el) return;
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  const session = JSON.parse(localStorage.getItem('trakdb_session') || 'null');
  if (session) {
    const initials = (session.username || '?').slice(0, 2).toUpperCase();
    el.textContent = initials;
    const img = document.createElement('img');
    img.src = session.avatar;
    img.alt = session.username;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    img.onload = () => { el.textContent = ''; el.style.background = 'none'; el.appendChild(img); };
    el.title = session.username;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => location.href = 'profile.html');
    const menu = document.createElement('div');
    menu.className = 'avatar-menu';
    menu.innerHTML = `<div class="avatar-menu-name">${session.username}</div><a class="avatar-menu-item" href="profile.html">profile</a><a class="avatar-menu-item" href="settings.html">settings</a><button class="avatar-menu-item" id="logout-btn">log out</button>`;
    wrap.appendChild(menu);
    menu.querySelector('#logout-btn').addEventListener('click', () => { localStorage.removeItem('trakdb_session'); location.href = 'login.html'; });
  } else {
    el.addEventListener('click', () => location.href = 'login.html');
    el.title = 'log in';
    document.querySelectorAll('.topnav-link').forEach(l => {
      if (['music', 'licenses', 'payments'].includes(l.textContent.trim())) l.href = 'features.html';
    });
  }
})();
</script>
