<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="trakdb1.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#646464;--dim:#3c3c3c;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

.topnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;align-items:center}
.topnav-link{font-size:14px;color:var(--muted);text-decoration:none;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s}
.topnav-link:hover,.topnav-link.active{color:var(--text)}

header{padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:#295ad6;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:none;flex-shrink:0;text-decoration:none}
.logo-mark svg{color:#fff}
.logo-name{font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);font-family:'Geist Mono',monospace;text-decoration:none}
.logo-name em{font-style:normal;color:#6285e4}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}

/* Artist grid */
.artist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.artist-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  text-decoration:none;color:var(--text);transition:background .15s,border-color .15s;
  display:flex;flex-direction:column;overflow:hidden;
}
.artist-card:hover{background:var(--card-h);border-color:var(--border-b)}
.artist-card-cover{width:100%;aspect-ratio:1;position:relative;overflow:hidden}
.artist-card-cover canvas{display:block;width:100%;height:100%}
.artist-card-body{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.artist-card-name{font-size:19px;font-weight:600;letter-spacing:-.3px}
.artist-card-meta{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}

footer{padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.footer-badge{color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 9px;letter-spacing:.3px;font-size:11px;white-space:nowrap}
.footer-sep{color:var(--dim)}

@media(max-width:580px){
  .topnav{gap:20px}.topnav-link{font-size:13px}
  .artist-grid{grid-template-columns:1fr}
}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:"JetBrains Mono",monospace}
.avatar:hover{opacity:.8}

/* Create artist */
.create-artist-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;margin-bottom:32px;
  background:transparent;border:1px dashed var(--border-b);border-radius:var(--radius);
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.create-artist-row:hover{background:var(--card);color:var(--text);border-color:var(--accent-g)}
.create-status{
  margin-top:-16px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--muted);text-align:center;min-height:14px;
}

/* Create artist modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border-b);border-radius:var(--radius);padding:28px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-.2px}
.modal-fields{display:flex;flex-direction:column;gap:12px}
.modal-field{display:flex;flex-direction:column;gap:5px}
.modal-field label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.modal-field input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Geist',sans-serif;font-size:14px;outline:none;transition:border-color .15s}
.modal-field input:focus{border-color:var(--accent)}
.modal-status{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-height:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-cancel{padding:9px 18px;background:transparent;border:1px solid var(--border-b);border-radius:8px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s}
.modal-cancel:hover{color:var(--text);border-color:var(--border-b)}
.modal-submit{padding:9px 18px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:opacity .15s}
.modal-submit:hover{opacity:.85}
.modal-submit:disabled{opacity:.5;cursor:not-allowed}

:root[data-theme="light"]{--bg:#f4f6f9;--surface:#ffffff;--card:#ffffff;--card-h:#eceff4;--border:#e4e8ee;--border-b:#d2d8e0;--text:#1b1e23;--muted:#5c6470;--dim:#9299a4;}
:root[data-theme="light"] body{background:radial-gradient(130% 100% at 50% 0%,#e8edf6 0%,var(--bg) 60%) fixed;}
:root[data-theme="light"] .list-table thead tr:hover{background:var(--card-h)}
:root[data-theme="light"] .orb{opacity:.55}

/* --- mobile responsive pass --- */
.nav-toggle{display:none;background:none;border:1px solid var(--border-b);border-radius:9px;padding:7px;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.nav-toggle:hover{color:var(--text);border-color:var(--dim)}
.nav-mobile-prof,.nav-mobile-acct{display:none}
.nav-mobile-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#2d1b69,#6285e4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.nav-mobile-name{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text)}
@media(max-width:640px){
  html{background:var(--bg)}
  header{padding:28px 0 20px;gap:12px}
  .logo-mark{width:48px;height:48px;border-radius:13px}
  .logo-mark svg{width:23px;height:23px}
  .logo-name{font-size:25px}
  .nav-toggle{padding:12px}
  .nav-toggle svg{width:24px;height:24px}
  body{font-size:14px}
  .stat-val{font-size:22px}
  .stat-card{padding:18px 20px}
  .track-title{font-size:26px}
  .detail-track{font-size:20px}
  .detail-header-name-val{font-size:15px}
  .profile-name{font-size:21px}
  .tc-name{font-size:15px}
  .artist-card-name{font-size:17px}
  .nav-toggle{display:flex}
  .avatar-wrap{display:none}
  .logo{margin-right:auto}
  .topnav{display:none}
  .topnav.open .nav-mobile-prof{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--border);text-decoration:none}
  .topnav.open .nav-mobile-acct{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .topnav.open{display:flex;flex-direction:column;gap:2px;position:absolute;top:calc(100% - 2px);right:0;left:auto;transform:none;background:var(--card);border:1px solid var(--border-b);border-radius:12px;padding:8px;min-width:190px;z-index:150;box-shadow:0 12px 32px rgba(0,0,0,.45);align-items:stretch}
  .topnav.open .topnav-link{padding:10px 14px;border-radius:8px;font-size:14px;text-align:left}
  .topnav.open .topnav-link:hover,.topnav.open .topnav-link.active{background:var(--card-h)}
  .stat-grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
  .table-scroll .list-table{min-width:560px}
}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('trakdb_settings')||'{}');if(s.theme==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>

<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <a href="index.html" class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
          <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
          <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
          <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
        </svg>
      </a>
      <a href="index.html" class="logo-name">trak<em>db</em></a>
    </div>
    <nav class="topnav">
      <a href="index.html" class="topnav-link">home</a>
      <a href="music.html" class="topnav-link active">music</a>
      <a href="licenses.html" class="topnav-link">licenses</a>
      <a href="payments.html" class="topnav-link">payments</a>
      <a href="tools.html" class="topnav-link">tools</a>
    </nav>
    <div class="avatar" title="account">?</div>
  </header>

  <div class="section-header"><div class="section-title">Artists</div></div>
  <div class="artist-grid" id="artist-grid"></div>

  <div class="create-artist-row" id="create-artist-row">+ add artist</div>
  <div class="create-status" id="create-status"></div>

  <footer>© 2026 trakdb</footer>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">Create artist</div>
    <div class="modal-fields">
      <div class="modal-field">
        <label>Artist name</label>
        <input type="text" id="modal-artist-name" placeholder="e.g. Notbrian" autocomplete="off">
      </div>
    </div>
    <div class="modal-status" id="modal-status"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel">cancel</button>
      <button class="modal-submit" id="modal-submit">create</button>
    </div>
  </div>
</div>

</div>
<script>
const ACCOUNTS_ARTISTS = {
  'Admin1': [
    { name: 'Notbrian',    trackCount: 5, avatar: 'accounts/Admin1/artists/Notbrian/avatar.jpeg', colors: ['#2d1b69','#1a3a6b','#0d4a6e'] },
    { name: 'NEVERHOME',   trackCount: 0, avatar: 'accounts/Admin1/artists/NEVERHOME/avatar.jpeg', colors: ['#3a0a0a','#6b0d0d','#1a0a0a'] },
  ],
};

const session  = JSON.parse(localStorage.getItem('trakdb_session') || 'null') || { username: 'Admin1' };
const username = session.username;
const ARTISTS  = (ACCOUNTS_ARTISTS[username] || []);

function drawCover(canvas, colors) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width  || canvas.offsetWidth  || 300;
  const h = rect.height || canvas.offsetHeight || 300;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const g = ctx.createRadialGradient(w*.3, h*.35, 0, w*.5, h*.5, w*.85);
  g.addColorStop(0,   colors[0]);
  g.addColorStop(.55, colors[1]);
  g.addColorStop(1,   colors[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*.04})`;
    ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
}

const grid = document.getElementById('artist-grid');

function renderArtistCard(a) {
  const card = document.createElement('a');
  card.href = `artist.html?artist=${encodeURIComponent(a.name)}`;
  card.className = 'artist-card';

  const coverDiv = document.createElement('div');
  coverDiv.className = 'artist-card-cover';
  if (a.avatar) {
    const img = document.createElement('img');
    img.src = a.avatar;
    img.alt = a.name;
    img.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;object-position:center';
    coverDiv.appendChild(img);
  } else {
    const canvas = document.createElement('canvas');
    coverDiv.appendChild(canvas);
    requestAnimationFrame(() => drawCover(canvas, a.colors));
  }

  const body = document.createElement('div');
  body.className = 'artist-card-body';
  const metaId = `meta-${a.name.replace(/\s+/g, '-')}`;
  body.innerHTML = `
    <div class="artist-card-name">${a.name}</div>
    <div class="artist-card-meta" id="${metaId}">${a.trackCount > 0 ? `${a.trackCount} track${a.trackCount !== 1 ? 's' : ''}` : 'No tracks yet'}</div>
  `;

  card.appendChild(coverDiv);
  card.appendChild(body);
  grid.appendChild(card);
}

ARTISTS.forEach(renderArtistCard);

/* Update track counts from real GitHub folder contents */
const GH_OWNER_M = 'desousabrian';
const GH_REPO_M  = 'desousabrian.github.io';
const GH_BRANCH_M = 'main';

ARTISTS.forEach(async a => {
  try {
    const songsPath = `accounts/${username}/artists/${encodeURIComponent(a.name)}/songs`;
    const res = await fetch(
      `https://api.github.com/repos/${GH_OWNER_M}/${GH_REPO_M}/contents/${songsPath}?ref=${GH_BRANCH_M}`
    );
    if (!res.ok) return;
    const files = await res.json();
    if (!Array.isArray(files)) return;
    const count = files.filter(f => f.type === 'file' && !f.name.startsWith('.')).length;
    const el = document.getElementById(`meta-${a.name.replace(/\s+/g, '-')}`);
    if (el) el.textContent = count > 0 ? `${count} track${count !== 1 ? 's' : ''}` : 'No tracks yet';
  } catch (e) { /* keep hardcoded count on failure */ }
});

/* ---- Create artist (commits folder structure + patches source files to GitHub) ---- */
const GH_OWNER  = 'desousabrian';
const GH_REPO   = 'desousabrian.github.io';
const GH_BRANCH = 'main';

const PALETTES = [
  ['#2d1b69','#1a3a6b','#080818'],
  ['#3a0a0a','#6b0d0d','#1a0a0a'],
  ['#1a3a1a','#0d4a2e','#0a1a0a'],
  ['#1a1a3a','#0d1a6b','#0a0a2e'],
  ['#3a1a2e','#6b0d4a','#1a0a1a'],
  ['#2a1a0a','#4a3010','#1a0a00'],
  ['#0a1a3a','#0d2e6b','#000a1a'],
  ['#1a2a0a','#2e4a0d','#0a1a00'],
];

function nameToColors(name) {
  let h = 0;
  for (const c of name) h = ((h * 31) + c.charCodeAt(0)) >>> 0;
  return PALETTES[h % PALETTES.length];
}

function ghHeaders(pat) {
  return { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' };
}

function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function b64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes  = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

const createStatusEl = document.getElementById('create-status');

function setStatus(msg, isError) {
  createStatusEl.textContent = msg;
  createStatusEl.style.color = isError ? '#e0667a' : 'var(--muted)';
}

function getPat() {
  let pat = localStorage.getItem('gh_pat');
  if (!pat) {
    pat = window.prompt('GitHub personal access token (needs "repo" scope) — stored locally in this browser only:');
    if (pat) localStorage.setItem('gh_pat', pat.trim());
  }
  return pat ? pat.trim() : null;
}

async function getValidPat() {
  for (let attempt = 0; attempt < 3; attempt++) {
    const pat = getPat();
    if (!pat) return null;
    setStatus('Checking token…');
    let res;
    try {
      res = await fetch('https://api.github.com/user', { headers: ghHeaders(pat) });
    } catch (e) {
      setStatus('Could not reach GitHub — check your connection.', true);
      return null;
    }
    if (res.ok) return pat;
    localStorage.removeItem('gh_pat');
    window.alert(res.status === 401
      ? 'That token was rejected by GitHub (invalid or expired). Try again with a fresh one.'
      : `GitHub rejected that token (status ${res.status}). Try again.`);
  }
  setStatus('Cancelled — too many invalid tokens.', true);
  return null;
}

async function ghGetFile(pat, path) {
  const res = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,
    { headers: ghHeaders(pat) }
  );
  if (!res.ok) {
    if (res.status === 401 || res.status === 403) localStorage.removeItem('gh_pat');
    throw new Error(`Could not fetch ${path} (${res.status})`);
  }
  return res.json();
}

async function ghPutFile(pat, path, content, sha, message) {
  const body = { message, content: utf8ToB64(content), branch: GH_BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,
    { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify(body) }
  );
  if (!res.ok) {
    if (res.status === 401 || res.status === 403) localStorage.removeItem('gh_pat');
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Commit failed (${res.status})`);
  }
  return res.json();
}

const modalOverlay  = document.getElementById('modal-overlay');
const modalArtistInput = document.getElementById('modal-artist-name');
const modalStatusEl = document.getElementById('modal-status');
const modalSubmitBtn = document.getElementById('modal-submit');

function openCreateModal() {
  modalArtistInput.value = '';
  modalStatusEl.textContent = '';
  modalStatusEl.style.color = 'var(--muted)';
  modalSubmitBtn.disabled = false;
  modalOverlay.classList.add('open');
  setTimeout(() => modalArtistInput.focus(), 50);
}

function closeCreateModal() {
  modalOverlay.classList.remove('open');
}

function setModalStatus(msg, isError) {
  modalStatusEl.textContent = msg;
  modalStatusEl.style.color = isError ? '#e0667a' : 'var(--muted)';
}

document.getElementById('modal-cancel').addEventListener('click', closeCreateModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeCreateModal(); });
modalArtistInput.addEventListener('keydown', e => { if (e.key === 'Enter') modalSubmitBtn.click(); });

document.getElementById('create-artist-row').addEventListener('click', openCreateModal);

document.getElementById('modal-submit').addEventListener('click', async () => {
  const artistName = modalArtistInput.value.trim();
  if (!artistName) { setModalStatus('Please enter an artist name.', true); return; }

  if (ARTISTS.find(a => a.name.toLowerCase() === artistName.toLowerCase())) {
    setModalStatus(`"${artistName}" already exists.`, true);
    return;
  }

  modalSubmitBtn.disabled = true;
  const pat = await getValidPat();
  if (!pat) { modalSubmitBtn.disabled = false; return; }

  const colors = nameToColors(artistName);

  try {
    setModalStatus('Creating artist folder…');
    const keepPath = `accounts/${username}/artists/${encodeURIComponent(artistName)}/songs/.gitkeep`;
    await ghPutFile(pat, keepPath, '', null, `Create artist: ${artistName}`);

    setModalStatus('Updating artist list…');
    const musicFile = await ghGetFile(pat, 'music.html');
    const musicSrc  = b64ToUtf8(musicFile.content);
    const newMusicEntry = `    { name: '${artistName.replace(/'/g,"\\'")}', trackCount: 0, colors: ${JSON.stringify(colors)} },`;
    const accountMusicMarker = `'${username}': [`;
    const accountMusicIdx = musicSrc.indexOf(accountMusicMarker);
    if (accountMusicIdx === -1) throw new Error(`Account '${username}' not found in music.html`);
    const musicClose = musicSrc.indexOf('\n  ],', accountMusicIdx);
    const newMusicSrc = musicSrc.slice(0, musicClose) + '\n' + newMusicEntry + musicSrc.slice(musicClose);
    await ghPutFile(pat, 'music.html', newMusicSrc, musicFile.sha, `Add ${artistName} to artist list`);

    setModalStatus('Updating artist database…');
    const artistFile = await ghGetFile(pat, 'artist.html');
    const artistSrc  = b64ToUtf8(artistFile.content);
    const newDbEntry = `    '${artistName.replace(/'/g,"\\'")}': { age: '—', based: '—', pronouns: '—', role: '—', colors: ${JSON.stringify(colors)}, tracks: [] },`;
    const accountDbMarker = `'${username}': {`;
    const accountDbIdx = artistSrc.indexOf(accountDbMarker);
    if (accountDbIdx === -1) throw new Error(`Account '${username}' not found in artist.html`);
    const dbClose = artistSrc.indexOf('\n  },', accountDbIdx);
    const newArtistSrc = artistSrc.slice(0, dbClose) + '\n' + newDbEntry + artistSrc.slice(dbClose);
    await ghPutFile(pat, 'artist.html', newArtistSrc, artistFile.sha, `Add ${artistName} to ARTIST_DB`);

    const newArtist = { name: artistName, trackCount: 0, colors };
    ARTISTS.push(newArtist);
    renderArtistCard(newArtist);

    closeCreateModal();
    setStatus(`Created "${artistName}" ✓`);
  } catch (err) {
    console.error(err);
    setModalStatus(`Failed: ${err.message}`, true);
    modalSubmitBtn.disabled = false;
  }
});
</script>

<script>
(function(){
  const el = document.querySelector('.avatar');
  if (!el) return;
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  const session = JSON.parse(localStorage.getItem('trakdb_session') || 'null');
  if (session) {
    const initials = (session.username || '?').slice(0, 2).toUpperCase();
    el.textContent = initials;
    const img = document.createElement('img');
    img.src = session.avatar;
    img.alt = session.username;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    img.onload = () => { el.textContent = ''; el.style.background = 'none'; el.appendChild(img); };
    el.title = session.username;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => location.href = 'account.html');
    const menu = document.createElement('div');
    menu.className = 'avatar-menu';
    menu.innerHTML = `<div class="avatar-menu-name">${session.username}</div><a class="avatar-menu-item" href="account.html">account</a><a class="avatar-menu-item" href="settings.html">settings</a><button class="avatar-menu-item" id="logout-btn">log out</button>`;
    wrap.appendChild(menu);
    menu.querySelector('#logout-btn').addEventListener('click', () => { localStorage.removeItem('trakdb_session'); location.href = 'login.html'; });
  } else {
    el.addEventListener('click', () => location.href = 'login.html');
    el.title = 'log in';
    document.querySelectorAll('.topnav-link').forEach(l => {
      if (['music', 'licenses', 'payments'].includes(l.textContent.trim())) l.href = 'features.html';
    });
  }
})();
</script>

ist.toggle('open');});document.addEventListener('click',function(e){if(!btn.contains(e.target)&&!nav.contains(e.target))nav.classList.remove('open');});})();</script>
