<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="trakdb1.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#646464;--dim:#3c3c3c;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);
  font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}

.login-wrap{
  position:relative;z-index:1;
  width:100%;max-width:380px;padding:24px;
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:36px;justify-content:center}
.logo-mark{
  width:34px;height:34px;background:#295ad6;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:none;flex-shrink:0;text-decoration:none;
}
.logo-name{
  font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);
  font-family:'Geist Mono',monospace;text-decoration:none;
}
.logo-name em{font-style:normal;color:#6285e4}

.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:32px;display:flex;flex-direction:column;gap:20px;
}
.login-title{
  font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--muted);letter-spacing:.8px;text-transform:uppercase;
}
.field input{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;color:var(--text);font-family:'Geist',sans-serif;font-size:14px;
  outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--accent)}
.login-btn{
  width:100%;padding:11px 0;background:var(--accent);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  border:none;border-radius:10px;cursor:pointer;
  box-shadow:0 0 24px var(--accent-g);transition:opacity .15s;letter-spacing:.3px;
}
.login-btn:hover{opacity:.85}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:#e0667a;text-align:center;min-height:16px;
}

:root[data-theme="light"]{--bg:#f4f6f9;--surface:#ffffff;--card:#ffffff;--card-h:#eceff4;--border:#e4e8ee;--border-b:#d2d8e0;--text:#1b1e23;--muted:#5c6470;--dim:#9299a4;}
:root[data-theme="light"] body{background:radial-gradient(130% 100% at 50% 0%,#e8edf6 0%,var(--bg) 60%) fixed;}
:root[data-theme="light"] .list-table thead tr:hover{background:var(--card-h)}
:root[data-theme="light"] .orb{opacity:.55}

/* --- mobile responsive pass --- */
.nav-toggle{display:none;background:none;border:1px solid var(--border-b);border-radius:9px;padding:7px;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.nav-toggle:hover{color:var(--text);border-color:var(--dim)}
.nav-mobile-prof,.nav-mobile-acct{display:none}
.nav-mobile-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#2d1b69,#6285e4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.nav-mobile-name{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text)}
@media(max-width:640px){
  html{background:var(--bg)}
  header{padding:22px 0 16px;gap:10px}
  .nav-toggle{display:flex}
  .avatar-wrap{display:none}
  .logo{margin-right:auto}
  .topnav{display:none}
  .topnav.open .nav-mobile-prof{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--border);text-decoration:none}
  .topnav.open .nav-mobile-acct{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .topnav.open{display:flex;flex-direction:column;gap:2px;position:absolute;top:calc(100% - 2px);right:0;left:auto;transform:none;background:var(--card);border:1px solid var(--border-b);border-radius:12px;padding:8px;min-width:190px;z-index:150;box-shadow:0 12px 32px rgba(0,0,0,.45);align-items:stretch}
  .topnav.open .topnav-link{padding:10px 14px;border-radius:8px;font-size:14px;text-align:left}
  .topnav.open .topnav-link:hover,.topnav.open .topnav-link.active{background:var(--card-h)}
  .stat-grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
  .table-scroll .list-table{min-width:560px}
}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('trakdb_settings')||'{}');if(s.theme==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-wrap">
  <div class="login-logo">
    <a href="index.html" class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
        <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
        <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
        <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
      </svg>
    </a>
    <a href="index.html" class="logo-name">trak<em>db</em></a>
  </div>

  <div class="login-card">
    <div class="login-title">Log in</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="Username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Password">
    </div>
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" id="login-btn">log in</button>
  </div>
</div>

<script>
/* NOTE: credentials are loaded from accounts/logins.csv — demo-grade only.
   On a public repo this file is visible to anyone with the URL. */

async function loadAccounts() {
  const res = await fetch('accounts/logins.csv');
  const text = await res.text();
  return text.split('\n')
    .slice(1) // skip header
    .map(line => line.split(',').map(s => s.trim()))
    .filter(cols => cols[0])
    .map(cols => ({ username: cols[0], password: cols[1], email: cols[2] }));
}

const usernameEl = document.getElementById('username');
const passwordEl = document.getElementById('password');
const loginBtn   = document.getElementById('login-btn');
const errorEl    = document.getElementById('login-error');

function resetBtn() { loginBtn.disabled = false; loginBtn.textContent = 'log in'; }

async function attemptLogin() {
  errorEl.textContent = '';
  const username = usernameEl.value.trim();
  const password = passwordEl.value;

  if (!username) { errorEl.textContent = 'Please enter a username.'; usernameEl.focus(); return; }
  if (!password) { errorEl.textContent = 'Please enter a password.'; passwordEl.focus(); return; }

  loginBtn.disabled = true;
  loginBtn.textContent = 'checking…';

  let accounts;
  try {
    accounts = await loadAccounts();
  } catch (e) {
    errorEl.textContent = 'Could not reach the login service. Try again.';
    resetBtn();
    return;
  }

  const match = accounts.find(a =>
    a.username.toLowerCase() === username.toLowerCase() && a.password === password
  );

  if (!match) {
    errorEl.textContent = 'Incorrect username or password.';
    resetBtn();
    passwordEl.focus();
    passwordEl.select();
    return;
  }

  localStorage.setItem('trakdb_session', JSON.stringify({
    username: match.username,
    email: match.email,
    avatar: `accounts/${match.username}/profile.png`,
  }));

  location.href = 'index.html';
}

loginBtn.addEventListener('click', attemptLogin);
[usernameEl, passwordEl].forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); })
);
</script>
<script>/* mobile nav hamburger */(function(){var header=document.querySelector('header');if(!header)return;var nav=header.querySelector('.topnav');if(!nav)return;if(header.querySelector('.nav-toggle'))return;var session=null;try{session=JSON.parse(localStorage.getItem('trakdb_session')||'null');}catch(e){}var btn=document.createElement('button');btn.className='nav-toggle';btn.setAttribute('aria-label','menu');btn.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';var anchor=header.querySelector('.avatar-wrap')||header.querySelector('.avatar');if(anchor)header.insertBefore(btn,anchor);else header.appendChild(btn);if(session){var prof=document.createElement('a');prof.href='account.html';prof.className='nav-mobile-prof';var ini=(session.username||'?').slice(0,2).toUpperCase();prof.innerHTML='<span class="nav-mobile-av">'+ini+'</span><span class="nav-mobile-name">'+(session.username||'')+'</span>';nav.insertBefore(prof,nav.firstChild);if(session.avatar){var im=new Image();im.onload=function(){var av=prof.querySelector('.nav-mobile-av');av.textContent='';av.style.background='none';im.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';av.appendChild(im);};im.src=session.avatar;}var acct=document.createElement('div');acct.className='nav-mobile-acct';acct.innerHTML='<a class="topnav-link" href="account.html">account</a><a class="topnav-link" href="settings.html">settings</a><button class="topnav-link" id="nav-logout" style="background:none;border:none;cursor:pointer;font-family:inherit">log out</button>';nav.appendChild(acct);var lo=acct.querySelector('#nav-logout');if(lo)lo.addEventListener('click',function(){localStorage.removeItem('trakdb_session');location.href='login.html';});}btn.addEventListener('click',function(e){e.stopPropagation();nav.classList.toggle('open');});document.addEventListener('click',function(e){if(!btn.contains(e.target)&&!nav.contains(e.target))nav.classList.remove('open');});})();</script>
</body>
</html>
