<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="trakdb1.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#646464;--dim:#3c3c3c;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);
  font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:700px;height:700px;background:rgba(98,133,228,.03);top:-250px;left:-200px}
.orb-2{width:600px;height:600px;background:rgba(54,217,217,.02);bottom:-150px;right:-150px}
.orb-3{width:400px;height:400px;background:rgba(245,192,64,.04);top:40%;left:30%}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* Nav */
.topnav{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;gap:36px;align-items:center;
}
.topnav-link{
  font-size:14px;color:var(--muted);text-decoration:none;
  font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s;
}
.topnav-link:hover,.topnav-link.active{color:var(--text)}

header{
  padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{
  width:34px;height:34px;background:#295ad6;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:none;flex-shrink:0;text-decoration:none;
}
.logo-name{
  font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);
  font-family:'Geist Mono',monospace;text-decoration:none;
}
.logo-name em{font-style:normal;color:#6285e4}

/* Hero */
.hero{padding:72px 0 80px;display:flex;flex-direction:column;gap:28px;align-items:center;text-align:center}
.hero-eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--accent);letter-spacing:2px;text-transform:uppercase;
}
.hero-title{
  font-size:clamp(40px,7vw,72px);font-weight:600;
  letter-spacing:-2px;line-height:1.0;color:var(--text);max-width:700px;
}
.hero-title em{font-style:normal;color:var(--accent)}
@keyframes cur-blink{0%,100%{opacity:1}50%{opacity:0}}
.type-cursor{display:inline-block;color:var(--accent);font-weight:300;animation:cur-blink 1s step-start infinite;margin-left:1px}
.type-cursor.done{animation:none;opacity:0;transition:opacity .6s}
.hero-sub{font-size:17px;color:var(--muted);max-width:480px;line-height:1.65}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
@keyframes slide-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hero-sub,.hero-actions{opacity:0}
.hero-sub.reveal{animation:slide-up .55s cubic-bezier(.22,1,.36,1) forwards}
.hero-actions.reveal{animation:slide-up .55s cubic-bezier(.22,1,.36,1) forwards}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;text-decoration:none;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  padding:10px 20px;border-radius:10px;transition:opacity .15s,border-color .15s;
  box-shadow:0 0 28px var(--accent-g);border:1px solid rgba(255,255,255,.15);
}
.btn-primary:hover{opacity:.92;border-color:rgba(255,255,255,.4)}
.btn-secondary{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--card);color:var(--text);text-decoration:none;
  font-family:'JetBrains Mono',monospace;font-size:13px;
  padding:10px 20px;border-radius:10px;border:1px solid var(--border);
  transition:border-color .15s;
}
.btn-secondary:hover{border-color:var(--border-b)}
.hero-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:100%;max-width:460px;margin-top:4px}
.hero-tile{display:flex;align-items:center;justify-content:center;padding:34px 20px;border:1px solid var(--border-b);border-radius:18px;background:var(--surface);color:var(--text);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.4px;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.hero-tile:hover{border-color:var(--accent);background:var(--card-h);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
@media(max-width:520px){.hero-tiles{grid-template-columns:1fr;max-width:300px}.hero-tile{padding:26px 20px}}
.home-company{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:4px}
.home-company-avatar{width:104px;height:104px;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:34px;font-family:'JetBrains Mono',monospace;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.home-company-avatar img{width:100%;height:100%;object-fit:cover}
.home-company-avatar svg{width:50px;height:50px;color:rgba(255,255,255,.8)}
.home-company-avatar.bare{background:none;border:none;box-shadow:none;border-radius:0}
.home-company-name{font-size:26px;font-weight:600;letter-spacing:-.4px;color:var(--text)}

/* Section label */
.section-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;
}

/* Latest release */
.latest{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 24px;display:flex;align-items:center;gap:20px;
  text-decoration:none;color:var(--text);transition:background .15s,border-color .15s;
  margin-bottom:64px;
}
.latest:hover{background:var(--card-h);border-color:var(--border-b)}
.latest-art{width:56px;height:56px;border-radius:10px;overflow:hidden;flex-shrink:0}
#latest-canvas{display:block;width:100%;height:100%}
.latest-info{flex:1;min-width:0}
.latest-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px}
.latest-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
.latest-meta{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.latest-arrow{color:var(--muted);flex-shrink:0}

/* Featured grid */
.featured{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:80px}
.featured-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-decoration:none;color:var(--text);
  transition:background .15s,border-color .15s;display:flex;flex-direction:column;gap:8px;
}
.featured-card:hover{background:var(--card-h);border-color:var(--border-b)}
.featured-card-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.featured-card-title{font-size:20px;font-weight:600;letter-spacing:-.3px}
.featured-card-sub{font-size:13px;color:var(--muted)}
.featured-card-badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.f-badge{font-family:'JetBrains Mono',monospace;font-size:10px;border-radius:5px;padding:2px 8px}
.f-bpm{color:var(--cyan);background:var(--cyan-d);border:1px solid rgba(54,217,217,.22)}
.f-dur{color:var(--muted);background:var(--card-h);border:1px solid var(--border-b)}

/* Footer */
footer{
  padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
}
.footer-badge{
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:3px 9px;letter-spacing:.3px;font-size:11px;white-space:nowrap;
}
.footer-sep{color:var(--dim)}

@media(max-width:600px){
  .topnav{gap:20px}.topnav-link{font-size:13px}
  .hero{padding:48px 0 56px}
  .featured{grid-template-columns:1fr}
}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:"JetBrains Mono",monospace}
.avatar:hover{opacity:.8}

:root[data-theme="light"]{--bg:#f4f6f9;--surface:#ffffff;--card:#ffffff;--card-h:#eceff4;--border:#e4e8ee;--border-b:#d2d8e0;--text:#1b1e23;--muted:#5c6470;--dim:#9299a4;}
:root[data-theme="light"] body{background:radial-gradient(130% 100% at 50% 0%,#e8edf6 0%,var(--bg) 60%) fixed;}
:root[data-theme="light"] .list-table thead tr:hover{background:var(--card-h)}
:root[data-theme="light"] .orb{opacity:.55}
:root[data-theme="light"] .home-company-avatar{box-shadow:0 6px 20px rgba(0,0,0,.12)}

/* --- mobile responsive pass --- */
.nav-toggle{display:none;background:none;border:1px solid var(--border-b);border-radius:9px;padding:7px;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.nav-toggle:hover{color:var(--text);border-color:var(--dim)}
.nav-mobile-prof,.nav-mobile-acct{display:none}
.nav-mobile-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#2d1b69,#6285e4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.nav-mobile-name{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text)}
@media(max-width:640px){
  html{background:var(--bg)}
  header{padding:22px 0 16px;gap:10px}
  .nav-toggle{display:flex}
  .avatar-wrap{display:none}
  .logo{margin-right:auto}
  .topnav{display:none}
  .topnav.open .nav-mobile-prof{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--border);text-decoration:none}
  .topnav.open .nav-mobile-acct{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .topnav.open{display:flex;flex-direction:column;gap:2px;position:absolute;top:calc(100% - 2px);right:0;left:auto;transform:none;background:var(--card);border:1px solid var(--border-b);border-radius:12px;padding:8px;min-width:190px;z-index:150;box-shadow:0 12px 32px rgba(0,0,0,.45);align-items:stretch}
  .topnav.open .topnav-link{padding:10px 14px;border-radius:8px;font-size:14px;text-align:left}
  .topnav.open .topnav-link:hover,.topnav.open .topnav-link.active{background:var(--card-h)}
  .stat-grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
  .table-scroll .list-table{min-width:560px}
}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('trakdb_settings')||'{}');if(s.theme==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <a href="index.html" class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
          <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
          <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
          <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
        </svg>
      </a>
      <a href="index.html" class="logo-name">trak<em>db</em></a>
    </div>
    <nav class="topnav">
      <a href="index.html" class="topnav-link active">home</a>
      <a href="music.html" class="topnav-link">music</a>
      <a href="licenses.html" class="topnav-link">licenses</a>
      <a href="payments.html" class="topnav-link">payments</a>
      <a href="tools.html" class="topnav-link">tools</a>
    </nav>
    <div class="avatar" title="account">?</div>
  </header>

  <section class="hero">
<h1 class="hero-title" id="hero-title" style="position:relative"><span aria-hidden="true" style="visibility:hidden">The complete platform for your music catalog.</span></h1>
    <p class="hero-sub">Manage recordings, licenses, payments, and everything else—all from one place.</p>
    <div class="hero-actions">
      <a href="features.html" class="btn-secondary">learn more</a>
      <a href="login.html" class="btn-primary">log in</a>
    </div>
  </section>

  <footer>© 2026 trakdb</footer>

</div>
<script>
const TRACKS = [
  { name: 'Cold Summer',        bpm: 184, duration: '1:52', colors: ['#2d1b69','#1a3a6b','#0d4a6e'] },
  { name: 'College Sweetheart', bpm: 125, duration: '2:57', colors: ['#6b1a4a','#8b2252','#3d1a6b'] },
  { name: 'Multicolor',         bpm: 125, duration: '2:06', colors: ['#1a4a2e','#1a3a6b','#4a1a6b'] },
  { name: 'Northstar',          bpm: 145, duration: '2:19', colors: ['#0d2a4a','#0a3a4a','#1a2a5e'] },
  { name: 'Pilot 43',           bpm: 138, duration: '3:12', colors: ['#4a2a0a','#6b3a0d','#3a1a0a'] },
];

function drawCover(canvas, colors, w, h) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const g = ctx.createRadialGradient(w*.35, h*.3, 0, w*.5, h*.5, w*.8);
  g.addColorStop(0, colors[0]);
  g.addColorStop(.5, colors[1]);
  g.addColorStop(1, colors[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 1200; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*.05})`;
    ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
}

drawCover(document.getElementById('latest-canvas'), TRACKS[4].colors, 56, 56);

const grid = document.getElementById('featured-grid');
TRACKS.slice(0, 4).forEach((t, i) => {
  const card = document.createElement('a');
  card.href = `track.html?track=${i}`;
  card.className = 'featured-card';
  card.innerHTML = `
    <div class="featured-card-label">Track ${i + 1}</div>
    <div class="featured-card-title">${t.name}</div>
    <div class="featured-card-sub">Artist Name</div>
    <div class="featured-card-badges">
      <span class="f-badge f-bpm">${t.bpm} BPM</span>
      <span class="f-badge f-dur">${t.duration}</span>
    </div>
  `;
  grid.appendChild(card);
});
</script>
<style>
.avatar-wrap{position:relative;margin-left:auto;flex-shrink:0}
.avatar-wrap .avatar{margin-left:0}
.avatar-menu{display:none;position:absolute;top:100%;right:0;margin-top:8px;background:var(--card);border:1px solid var(--border-b);border-radius:10px;padding:6px;min-width:150px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.avatar-menu::before{content:'';position:absolute;top:-8px;left:0;right:0;height:8px}
.avatar-wrap:hover .avatar-menu{display:block}
.avatar-menu-name{display:block;padding:4px 12px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.avatar-menu-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:6px 14px 10px;letter-spacing:.3px}
.avatar-menu-item{display:block;width:100%;padding:7px 12px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);background:none;border:none;text-align:left;text-decoration:none;cursor:pointer;transition:background .1s}
.avatar-menu-item:hover{background:var(--card-h)}
</style>
<script>
(function(){
  const el = document.querySelector('.avatar');
  if (!el) return;
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  const session = JSON.parse(localStorage.getItem('trakdb_session') || 'null');
  if (session) {
    const initials = (session.username || '?').slice(0, 2).toUpperCase();
    el.textContent = initials;
    const img = document.createElement('img');
    img.src = session.avatar;
    img.alt = session.username;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    img.onload = () => { el.textContent = ''; el.style.background = 'none'; el.appendChild(img); };
    el.title = session.username;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => location.href = 'account.html');
    const menu = document.createElement('div');
    menu.className = 'avatar-menu';
    menu.innerHTML = `<div class="avatar-menu-name">${session.username}</div><a class="avatar-menu-item" href="account.html">account</a><a class="avatar-menu-item" href="settings.html">settings</a><button class="avatar-menu-item" id="logout-btn">log out</button>`;
    wrap.appendChild(menu);
    menu.querySelector('#logout-btn').addEventListener('click', () => { localStorage.removeItem('trakdb_session'); location.href = 'login.html'; });
    document.querySelector('.hero-title')?.remove();
    document.querySelector('.hero-sub')?.remove();
    const heroActions = document.querySelector('.hero-actions');
    if (heroActions) {
      const companyPlaceholder = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>`;
      const company = document.createElement('div');
      company.className = 'home-company';
      company.innerHTML = `<div class="home-company-avatar" id="home-company-avatar">${companyPlaceholder}</div>`;
      heroActions.parentNode.insertBefore(company, heroActions);
      const companySrc = 'accounts/company.png';
      const cImg = new Image();
      cImg.alt = session.username || '';
      cImg.onload = () => { const av = document.getElementById('home-company-avatar'); av.innerHTML = ''; av.classList.add('bare'); av.appendChild(cImg); };
      cImg.src = companySrc;
      heroActions.classList.add('hero-tiles', 'reveal');
      heroActions.innerHTML = `<a href="music.html" class="hero-tile">music</a><a href="licenses.html" class="hero-tile">licenses</a><a href="payments.html" class="hero-tile">payments</a><a href="tools.html" class="hero-tile">tools</a>`;
    }
  } else {
    el.addEventListener('click', () => location.href = 'login.html');
    el.title = 'log in';
    document.querySelectorAll('.topnav-link').forEach(l => {
      if (['music', 'licenses', 'payments'].includes(l.textContent.trim())) l.href = 'features.html';
    });
  }
})();
</script>
<script>
(function(){
  const el = document.getElementById('hero-title');
  if (!el) return;
  const text = 'The complete platform for your music catalog.';
  const overlay = document.createElement('span');
  overlay.style.cssText = 'position:absolute;top:0;left:0;right:0;text-align:center';
  el.appendChild(overlay);
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '|';
  overlay.appendChild(cursor);
  let i = 0;
  function type() {
    if (i < text.length) {
      overlay.insertBefore(document.createTextNode(text[i++]), cursor);
      setTimeout(type, i < 4 ? 60 : 38);
    } else {
      setTimeout(() => cursor.classList.add('done'), 900);
      document.querySelector('.hero-sub')?.classList.add('reveal');
      setTimeout(() => document.querySelector('.hero-actions')?.classList.add('reveal'), 120);
    }
  }
  setTimeout(type, 350);
})();
</script>
<script>/* mobile nav hamburger */(function(){var header=document.querySelector('header');if(!header)return;var nav=header.querySelector('.topnav');if(!nav)return;if(header.querySelector('.nav-toggle'))return;var session=null;try{session=JSON.parse(localStorage.getItem('trakdb_session')||'null');}catch(e){}var btn=document.createElement('button');btn.className='nav-toggle';btn.setAttribute('aria-label','menu');btn.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';var anchor=header.querySelector('.avatar-wrap')||header.querySelector('.avatar');if(anchor)header.insertBefore(btn,anchor);else header.appendChild(btn);if(session){var prof=document.createElement('a');prof.href='account.html';prof.className='nav-mobile-prof';var ini=(session.username||'?').slice(0,2).toUpperCase();prof.innerHTML='<span class="nav-mobile-av">'+ini+'</span><span class="nav-mobile-name">'+(session.username||'')+'</span>';nav.insertBefore(prof,nav.firstChild);if(session.avatar){var im=new Image();im.onload=function(){var av=prof.querySelector('.nav-mobile-av');av.textContent='';av.style.background='none';im.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';av.appendChild(im);};im.src=session.avatar;}var acct=document.createElement('div');acct.className='nav-mobile-acct';acct.innerHTML='<a class="topnav-link" href="account.html">account</a><a class="topnav-link" href="settings.html">settings</a><button class="topnav-link" id="nav-logout" style="background:none;border:none;cursor:pointer;font-family:inherit">log out</button>';nav.appendChild(acct);var lo=acct.querySelector('#nav-logout');if(lo)lo.addEventListener('click',function(){localStorage.removeItem('trakdb_session');location.href='login.html';});}btn.addEventListener('click',function(e){e.stopPropagation();nav.classList.toggle('open');});document.addEventListener('click',function(e){if(!btn.contains(e.target)&&!nav.contains(e.target))nav.classList.remove('open');});})();</script>
