<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#505050;--dim:#303030;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --green:#4cc38a;--green-d:rgba(76,195,138,.12);
  --red:#e0667a;--red-d:rgba(224,102,122,.12);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --radius:14px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

.topnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;align-items:center}
.topnav-link{font-size:14px;color:var(--muted);text-decoration:none;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s}
.topnav-link:hover,.topnav-link.active{color:var(--text)}

header{padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:#295ad6;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.logo-name{font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);font-family:'Geist Mono',monospace;text-decoration:none}
.logo-name em{font-style:normal;color:#6285e4}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:'JetBrains Mono',monospace}
.avatar:hover{opacity:.8}
.avatar-wrap{position:relative;margin-left:auto;flex-shrink:0}
.avatar-wrap .avatar{margin-left:0}
.avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:10px;padding:8px 0;min-width:160px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.avatar-menu.open{display:block}
.avatar-menu-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:6px 14px 10px;letter-spacing:.3px}
.avatar-menu-item{display:block;width:100%;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);background:none;border:none;text-align:left;cursor:pointer;transition:background .1s}
.avatar-menu-item:hover{background:var(--card-h)}

.back-link{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-decoration:none;transition:color .15s;margin-bottom:28px}
.back-link:hover{color:var(--text)}
.back-link svg{width:14px;height:14px}

.detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.detail-card-header{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px}
.detail-card-header-avatar{width:52px;height:52px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--card-h);border:1px solid var(--border)}
.detail-card-header-avatar img{width:100%;height:100%;object-fit:cover;display:none}
.detail-track{font-size:22px;font-weight:600;letter-spacing:-.3px}
.detail-artist{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-top:2px}
.detail-header-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}

.detail-rows{padding:8px 0}
.detail-row{display:flex;align-items:center;padding:14px 28px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);width:120px;flex-shrink:0;letter-spacing:.3px;text-transform:uppercase}
.detail-val{font-size:14px;color:var(--text)}
.detail-val.amount{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500}
.detail-val.amount.positive{color:var(--green)}
.detail-val.amount.negative{color:var(--red)}

.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.badge-received,.badge-paid,.badge-accepted{background:var(--green-d);color:var(--green)}
.badge-pending,.badge-sent{background:var(--gold-d);color:var(--gold)}
.badge-overdue,.badge-declined{background:var(--red-d);color:var(--red)}

.notes-save-btn{padding:5px 12px;background:var(--accent);border:none;border-radius:7px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:opacity .15s;display:none}
.notes-save-btn:hover{opacity:.8}
.notes-cancel-btn{padding:5px 12px;background:transparent;border:1px solid var(--border-b);border-radius:7px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:color .15s,border-color .15s;display:none}
.notes-cancel-btn:hover{color:var(--text);border-color:var(--dim)}
.notes-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.notes-textarea{width:100%;min-height:100px;background:var(--card-h);border:1px solid var(--border);border-radius:8px;resize:vertical;padding:10px 12px;color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.6;outline:none;transition:border-color .15s}
.notes-textarea:focus{border-color:var(--accent)}

.attach-section{margin-bottom:32px}
.attach-title{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px}
.attach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.attach-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-size:13px;transition:background .15s,border-color .15s;cursor:pointer}
.attach-item:hover{background:var(--card-h);border-color:var(--border-b)}
.attach-delete{margin-left:auto;flex-shrink:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;transition:color .15s}
.attach-delete:hover{color:var(--red)}
.attach-item-icon{color:var(--muted);flex-shrink:0}
.attach-item-name{flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-split{display:flex;align-items:stretch;border:1px dashed var(--border-b);border-radius:var(--radius);transition:border-color .15s}
.upload-split:hover{border-color:var(--accent-g)}
.upload-row{flex:8;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;background:transparent;border:none;border-radius:calc(var(--radius) - 1px) 0 0 calc(var(--radius) - 1px);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.upload-row:hover{background:var(--card);color:var(--text)}
.forms-wrap{flex:2;position:relative;display:flex}
.forms-btn{flex:1;padding:12px 10px;background:transparent;border:none;border-left:1px dashed var(--border-b);border-radius:0 calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.forms-btn:hover{background:var(--card);color:var(--text)}
.forms-dropdown{display:none;position:absolute;bottom:calc(100% + 5px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:8px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:200px}
.forms-dropdown.open{display:block}
.forms-dropdown-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding:9px 14px 6px}
.forms-item{display:flex;align-items:center;gap:9px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap;text-decoration:none;color:var(--text)}
.forms-item:hover{background:var(--card-h)}
.forms-item-icon{color:var(--muted);flex-shrink:0}
.forms-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.forms-empty{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:10px 14px;text-align:center}
.upload-status{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;min-height:14px}
.file-preview-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:40px}
.file-preview-overlay.open{display:flex}
.file-preview-modal{background:var(--card);border:1px solid var(--border-b);border-radius:14px;width:min(900px,100%);height:min(85vh,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.file-preview-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.file-preview-title{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.file-preview-dl{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted);text-decoration:none;transition:color .15s,background .15s}
.file-preview-dl:hover{color:var(--text);background:var(--card-h)}
.file-preview-close{width:30px;height:30px;border:none;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:8px;transition:color .15s,background .15s}
.file-preview-close:hover{color:var(--text);background:var(--card-h)}
.file-preview-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#0d0d0f);overflow:auto}
.file-preview-frame{width:100%;height:100%;border:none;background:#fff}
.file-preview-img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.file-preview-loading{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:40px;text-align:center}
.file-preview-loading a{color:var(--text)}

footer{padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim)}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <a href="index.html" class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
          <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
          <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
          <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
        </svg>
      </a>
      <a href="index.html" class="logo-name">trak<em>db</em></a>
    </div>
    <nav class="topnav">
      <a href="index.html" class="topnav-link">home</a>
      <a href="music.html" class="topnav-link">music</a>
      <a href="licenses.html" class="topnav-link">licenses</a>
      <a href="payments.html" class="topnav-link active">payments</a>
      <a href="tools.html" class="topnav-link">tools</a>
    </nav>
    <div class="avatar" title="profile">?</div>
  </header>

  <a href="payments.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    back to payments
  </a>

  <div class="detail-card">
    <div class="detail-card-header">
      <div class="detail-card-header-avatar"><img id="artist-avatar" alt=""></div>
      <div>
        <div class="detail-track" id="hd-track">—</div>
        <div class="detail-artist" id="hd-artist">—</div>
      </div>
      <div class="detail-header-right">
        <span class="badge" id="hd-status"></span>
      </div>
    </div>
    <div class="detail-rows">
      <div class="detail-row">
        <div class="detail-label">Date</div>
        <div class="detail-val" id="d-date">—</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Artist</div>
        <div class="detail-val" id="d-artist">—</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Track</div>
        <div class="detail-val" id="d-track">—</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Party</div>
        <div class="detail-val" id="d-from">—</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Amount</div>
        <div class="detail-val amount" id="d-amount">—</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Status</div>
        <div class="detail-val"><span class="badge" id="d-status">—</span></div>
      </div>
      <div class="detail-row" style="align-items:flex-start;border-bottom:none">
        <div class="detail-label" style="padding-top:4px">Notes</div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px">
          <textarea class="notes-textarea" id="notes-textarea" placeholder="Add notes…"></textarea>
          <div style="display:flex;align-items:center;gap:10px;justify-content:flex-end">
            <span class="notes-status" id="notes-status"></span>
            <button class="notes-cancel-btn" id="notes-cancel">cancel</button>
            <button class="notes-save-btn" id="notes-save">save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="upload-wrap" style="margin-bottom:8px">
    <div class="upload-split">
      <div class="upload-row" id="upload-row">+ upload files</div>
      <div class="forms-wrap">
        <button class="forms-btn" id="forms-btn" type="button">forms</button>
        <div class="forms-dropdown" id="forms-dropdown"></div>
      </div>
    </div>
    <input type="file" id="upload-input" style="display:none">
    <div class="upload-status" id="upload-status"></div>
  </div>

  <div class="attach-section" id="attach-section" style="display:none">
    <div class="attach-title">Attachments</div>
    <div class="attach-list" id="attach-list"></div>
  </div>

  <footer>trakdb</footer>
</div>

<div class="file-preview-overlay" id="file-preview-overlay">
  <div class="file-preview-modal">
    <div class="file-preview-head">
      <span class="file-preview-title" id="file-preview-title"></span>
      <div class="file-preview-actions">
        <a class="file-preview-dl" id="file-preview-download" title="Download">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
        <button class="file-preview-close" id="file-preview-close" title="Close">&times;</button>
      </div>
    </div>
    <div class="file-preview-body" id="file-preview-body"></div>
  </div>
</div>
<script>
const p = new URLSearchParams(location.search);
const date   = p.get('date')   || '';
const artist = p.get('artist') || '';
const track  = p.get('track')  || '';
const from   = p.get('from')   || '';
const amount = p.get('amount') || '';
const status = p.get('status') || '';

document.getElementById('hd-track').textContent  = track  || '—';
document.getElementById('hd-artist').textContent = artist || '—';
document.getElementById('d-date').textContent    = date   || '—';
document.getElementById('d-artist').textContent  = artist || '—';
document.getElementById('d-track').textContent   = track  || '—';
document.getElementById('d-from').textContent    = from   || '—';
const amt = parseFloat(amount);
const amtEl = document.getElementById('d-amount');
if (!isNaN(amt)) {
  amtEl.textContent = (amt < 0 ? '-' : '') + '$' + Math.abs(amt).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  amtEl.classList.add(amt < 0 ? 'negative' : 'positive');
}

function badgeClass(s) {
  const l = (s || '').toLowerCase();
  return 'badge badge-' + (l === 'received' || l === 'paid' ? 'received' : l === 'accepted' ? 'accepted' : l === 'declined' ? 'declined' : l === 'overdue' ? 'overdue' : l === 'sent' ? 'sent' : 'pending');
}

const sl = status || '—';
[document.getElementById('hd-status'), document.getElementById('d-status')].forEach(el => {
  el.textContent = sl;
  el.className = badgeClass(status);
});

const session = JSON.parse(localStorage.getItem('trakdb_session') || 'null');
if (session && artist) {
  const GH = 'https://desousabrian.github.io';
  const img = document.getElementById('artist-avatar');
  img.onload = () => { img.style.display = 'block'; };
  img.src = `${GH}/accounts/${session.username}/artists/${encodeURIComponent(artist)}/avatar.jpeg`;
}

document.title = `trakdb — ${track || 'statement'}`;

const GH_OWNER = 'desousabrian', GH_REPO = 'desousabrian.github.io', GH_BRANCH = 'main';
const username = (JSON.parse(localStorage.getItem('trakdb_session') || 'null') || {}).username || 'Admin1';
const noteKey  = [date, artist, track].map(s => s.replace(/[^a-z0-9]/gi, '_')).join('__');
const notePath = `accounts/${username}/payments/notes/${noteKey}.txt`;

function ghHeaders(pat) { return { Authorization: `token ${pat}`, 'Content-Type': 'application/json' }; }
function utf8ToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64ToUtf8(s) { return decodeURIComponent(escape(atob(s))); }

async function getValidPat() {
  let pat = localStorage.getItem('gh_pat') || '';
  if (!pat) { pat = prompt('Enter GitHub PAT:') || ''; if (pat) localStorage.setItem('gh_pat', pat); }
  return pat;
}

let _notesSha = null;

async function loadNotes() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${notePath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const j = await res.json();
    _notesSha = j.sha;
    const val = b64ToUtf8(j.content.replace(/\n/g,''));
    document.getElementById('notes-textarea').value = val;
    _savedNotes = val;
  } catch(e) {}
}

const saveBtn    = document.getElementById('notes-save');
const cancelBtn  = document.getElementById('notes-cancel');
const noteStatus = document.getElementById('notes-status');
let _savedNotes  = '';

function updateNotesBtns(ta) {
  const dirty = ta.value !== _savedNotes;
  saveBtn.style.display   = dirty ? 'inline-block' : 'none';
  cancelBtn.style.display = dirty ? 'inline-block' : 'none';
}

const notesTa = document.getElementById('notes-textarea');
notesTa.addEventListener('input', () => { noteStatus.textContent = ''; updateNotesBtns(notesTa); });
cancelBtn.addEventListener('click', () => { notesTa.value = _savedNotes; updateNotesBtns(notesTa); noteStatus.textContent = ''; });

saveBtn.addEventListener('click', async () => {
  const content = document.getElementById('notes-textarea').value;
  const pat = await getValidPat();
  if (!pat) return;
  saveBtn.disabled = true;
  saveBtn.textContent = 'saving…';
  try {
    const body = { message: `update notes: ${noteKey}`, content: utf8ToB64(content), branch: GH_BRANCH };
    if (_notesSha) body.sha = _notesSha;
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${notePath}`, { method:'PUT', headers: ghHeaders(pat), body: JSON.stringify(body) });
    if (!res.ok) throw new Error();
    const j = await res.json();
    _notesSha = j.content.sha;
    _savedNotes = content;
    saveBtn.style.display = 'none';
    cancelBtn.style.display = 'none';
    noteStatus.textContent = 'saved';
    setTimeout(() => { noteStatus.textContent = ''; }, 2000);
  } catch(e) {
    noteStatus.textContent = 'error saving';
  }
  saveBtn.disabled = false;
  saveBtn.textContent = 'save';
});

loadNotes();

// ---- Attachments & forms ----
const filesPath  = `accounts/${username}/payments/files/${noteKey}`;
const formsPath  = `accounts/${username}/payments/forms`;
const attachSection = document.getElementById('attach-section');
const attachList    = document.getElementById('attach-list');
const uploadRow     = document.getElementById('upload-row');
const uploadInput   = document.getElementById('upload-input');
const uploadStatus  = document.getElementById('upload-status');

function setUploadStatus(msg, isError) {
  uploadStatus.textContent = msg;
  uploadStatus.style.color = isError ? 'var(--red)' : 'var(--muted)';
}

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return '📄';
  if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '🖼';
  if (['mp3','wav','flac','aac','ogg','m4a'].includes(ext)) return '🎵';
  return '📎';
}

function arrayBufferToB64(buf) {
  const bytes = new Uint8Array(buf); let binary = ''; const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}

let _previewObjectUrl = null;
function openFilePreview(fileName, url) {
  const overlay = document.getElementById('file-preview-overlay');
  const body    = document.getElementById('file-preview-body');
  const title   = document.getElementById('file-preview-title');
  const dl      = document.getElementById('file-preview-download');
  title.textContent = fileName;
  dl.href = url; dl.setAttribute('download', fileName);
  body.innerHTML = '<div class="file-preview-loading">loading…</div>';
  overlay.classList.add('open');
  const ext = (fileName.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp','bmp','svg','avif'].includes(ext)) {
    const img = document.createElement('img');
    img.className = 'file-preview-img'; img.alt = fileName;
    img.onload  = () => { body.innerHTML = ''; body.appendChild(img); };
    img.onerror = () => { body.innerHTML = `<div class="file-preview-loading">Couldn't preview. <a href="${url}" download="${fileName}">Download instead</a></div>`; };
    img.src = url; return;
  }
  const mime = ext === 'pdf' ? 'application/pdf' : 'text/plain';
  fetch(url).then(r => { if (!r.ok) throw new Error(); return r.blob(); })
    .then(blob => {
      if (_previewObjectUrl) URL.revokeObjectURL(_previewObjectUrl);
      _previewObjectUrl = URL.createObjectURL(new Blob([blob], { type: mime }));
      const frame = document.createElement('iframe');
      frame.className = 'file-preview-frame'; frame.src = _previewObjectUrl;
      body.innerHTML = ''; body.appendChild(frame);
    })
    .catch(() => { body.innerHTML = `<div class="file-preview-loading">Couldn't preview. <a href="${url}" download="${fileName}">Download instead</a></div>`; });
}
function closeFilePreview() {
  document.getElementById('file-preview-overlay').classList.remove('open');
  document.getElementById('file-preview-body').innerHTML = '';
  if (_previewObjectUrl) { URL.revokeObjectURL(_previewObjectUrl); _previewObjectUrl = null; }
}
(function(){
  const overlay = document.getElementById('file-preview-overlay');
  document.getElementById('file-preview-close').addEventListener('click', closeFilePreview);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFilePreview(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeFilePreview(); });
})();

async function loadAttachments() {
  attachList.innerHTML = '';
  attachSection.style.display = 'none';
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${filesPath}?ref=${GH_BRANCH}`);
    if (!res.ok) return;
    const items = await res.json();
    if (!Array.isArray(items)) return;
    const files = items.filter(f => f.type === 'file' && !f.name.startsWith('.'));
    if (!files.length) return;
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'attach-item';
      a.innerHTML = `<span class="attach-item-icon">${fileIcon(f.name)}</span><span class="attach-item-name">${f.name}</span>`;
      a.addEventListener('click', e => { e.preventDefault(); openFilePreview(f.name, f.download_url); });
      const del = document.createElement('button');
      del.className = 'attach-delete'; del.textContent = '×'; del.title = 'Delete file';
      del.addEventListener('click', async e => {
        e.preventDefault(); e.stopPropagation();
        if (!confirm(`Delete "${f.name}"?`)) return;
        const pat = await getValidPat(); if (!pat) return;
        const delRes = await fetch(
          `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(`${filesPath}/${f.name}`)}`,
          { method: 'DELETE', headers: ghHeaders(pat), body: JSON.stringify({ message: `Remove attachment: ${f.name}`, sha: f.sha, branch: GH_BRANCH }) }
        );
        if (delRes.ok) loadAttachments();
      });
      a.appendChild(del);
      attachList.appendChild(a);
    });
    attachSection.style.display = '';
  } catch(e) {}
}

loadAttachments();

uploadRow.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', async () => {
  const file = uploadInput.files[0]; uploadInput.value = '';
  if (!file) return;
  const pat = await getValidPat(); if (!pat) return;
  try {
    setUploadStatus('Reading file…');
    const buf = await file.arrayBuffer();
    setUploadStatus('uploading…');
    const path = `${filesPath}/${file.name}`;
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}`,
      { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify({ message: `Attach file to statement: ${noteKey}`, content: arrayBufferToB64(buf), branch: GH_BRANCH }) });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `Upload failed (${res.status})`); }
    setUploadStatus('uploaded ✓');
    loadAttachments();
    setTimeout(() => setUploadStatus(''), 2500);
  } catch(err) { setUploadStatus(`Failed: ${err.message}`, true); }
});

// ---- Forms dropdown ----
const formsBtn      = document.getElementById('forms-btn');
const formsDropdown = document.getElementById('forms-dropdown');
let _formsLoaded = false;

async function loadForms() {
  formsDropdown.innerHTML = `<div class="forms-empty">loading…</div>`;
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${formsPath}?ref=${GH_BRANCH}`);
    if (!res.ok) { formsDropdown.innerHTML = `<div class="forms-empty">No forms available.</div>`; return; }
    const items = await res.json();
    const files = Array.isArray(items) ? items.filter(f => f.type === 'file' && !f.name.startsWith('.')) : [];
    if (!files.length) { formsDropdown.innerHTML = `<div class="forms-empty">No forms available.</div>`; return; }
    files.sort((a, b) => a.name.localeCompare(b.name));
    formsDropdown.innerHTML = `<div class="forms-dropdown-label">preset forms</div>`;
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'forms-item';
      a.href = f.download_url; a.setAttribute('download', f.name);
      a.innerHTML = `<span class="forms-item-icon">${fileIcon(f.name)}</span><span class="forms-item-name">${f.name.replace(/\.[^.]+$/, '')}</span>`;
      formsDropdown.appendChild(a);
    });
  } catch(e) { formsDropdown.innerHTML = `<div class="forms-empty">Couldn't load forms.</div>`; }
}

formsBtn.addEventListener('click', e => {
  e.stopPropagation();
  const willOpen = !formsDropdown.classList.contains('open');
  formsDropdown.classList.toggle('open', willOpen);
  if (willOpen && !_formsLoaded) { _formsLoaded = true; loadForms(); }
});
document.addEventListener('click', () => formsDropdown.classList.remove('open'));
formsDropdown.addEventListener('click', e => e.stopPropagation());

(function(){
  const el = document.querySelector('.avatar');
  if (!el) return;
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  const session = JSON.parse(localStorage.getItem('trakdb_session') || 'null');
  if (session) {
    el.innerHTML = '';
    el.style.background = 'none';
    const img = document.createElement('img');
    img.src = session.avatar;
    img.alt = session.username;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    el.appendChild(img);
    el.title = session.username;
    const menu = document.createElement('div');
    menu.className = 'avatar-menu';
    menu.innerHTML = `<div class="avatar-menu-name">${session.username}</div><button class="avatar-menu-item" id="logout-btn">log out</button>`;
    wrap.appendChild(menu);
    el.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click', () => menu.classList.remove('open'));
    menu.querySelector('#logout-btn').addEventListener('click', () => { localStorage.removeItem('trakdb_session'); location.href = 'login.html'; });
  } else {
    el.addEventListener('click', () => location.href = 'login.html');
    el.title = 'log in';
  }
})();
</script>
