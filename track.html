<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="trakdb1.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trakdb — track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--card-h:#1a1a1a;
  --border:#202020;--border-b:#2e2e2e;--text:#e0e0e0;--muted:#646464;--dim:#3c3c3c;
  --accent:#6285e4;--accent-d:rgba(98,133,228,.14);--accent-g:rgba(98,133,228,.28);
  --cyan:#36d9d9;--cyan-d:rgba(54,217,217,.12);
  --gold:#f5c040;--gold-d:rgba(245,192,64,.12);
  --lp:#8b76ff;--red:#e85252;--lime:#52c87a;--orange:#f97316;
  --radius:14px;
}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(130% 100% at 50% 0%,#0d1017 0%,var(--bg) 60%) fixed;color:var(--text);
  font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
}
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:rgba(98,133,228,.03);top:-200px;left:-150px}
.orb-2{width:500px;height:500px;background:rgba(54,217,217,.02);bottom:-100px;right:-100px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

.topnav{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;gap:36px;align-items:center;
}
.topnav-link{
  font-size:14px;color:var(--muted);text-decoration:none;
  font-family:'JetBrains Mono',monospace;letter-spacing:.3px;transition:color .15s;
}
.topnav-link:hover{color:var(--text)}
.topnav-link.active{color:var(--text)}

header{
  padding:36px 0 28px;display:flex;align-items:center;gap:14px;position:relative;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{
  width:34px;height:34px;background:#295ad6;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:none;flex-shrink:0;text-decoration:none;
}
.logo-name{
  font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text);
  font-family:'Geist Mono',monospace;text-decoration:none;
}
.logo-name em{font-style:normal;color:#6285e4}

/* Back link */
.back-link{
  position:absolute;top:110px;right:0;
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-family:'JetBrains Mono',monospace;
  color:var(--muted);text-decoration:none;
  transition:color .15s;z-index:2;
}
.back-link:hover{color:var(--text)}

/* Track layout */
.track-layout{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:auto auto;
  column-gap:36px;row-gap:10px;
  align-items:start;
}
.track-meta{grid-column:2;grid-row:1}
.details-card{grid-column:2;grid-row:2}

/* Cover art */
.cover{
  width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;
  position:relative;flex-shrink:0;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.cover-gradient{width:100%;height:100%}
.cover-img{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-img.show{display:block}
.cover-edit-btn{display:none;position:absolute;right:10px;bottom:10px;width:34px;height:34px;align-items:center;justify-content:center;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;backdrop-filter:blur(6px);transition:background .15s,border-color .15s;z-index:2}
.cover-edit-btn:hover{background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.5)}
.cover.editing .cover-edit-btn{display:flex}
.cover-col{grid-column:1;grid-row:1}
.cover-btns{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:10px}
.analyze-btn{
  width:100%;padding:9px 0;
  background:transparent;border:1px solid var(--border-b);border-radius:10px;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;
  letter-spacing:.5px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.analyze-btn:hover{background:var(--card-h);color:var(--text);border-color:var(--accent-g)}
.tools-wrap{position:relative;width:100%}
.tools-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:210px;background:var(--card);border:1px solid var(--border-b);border-radius:10px;padding:6px;z-index:120;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.tools-dropdown.open{display:block}
.tools-item{display:block;width:100%;padding:8px 12px;border-radius:7px;background:none;border:none;text-align:left;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:background .1s;white-space:nowrap}
.tools-item:hover{background:var(--card-h)}
.versions-wrap{position:relative;width:100%}
.versions-btn{
  width:100%;padding:9px 0;
  background:transparent;border:1px solid var(--border-b);border-radius:10px;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;
  letter-spacing:.5px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.versions-btn:hover{background:var(--card-h);color:var(--text);border-color:var(--accent-g)}
.versions-dropdown{
  display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--card);border:1px solid var(--border-b);border-radius:10px;
  padding:12px 14px;z-index:10;display:none;flex-direction:column;gap:8px;
}
.versions-dropdown.open{display:flex}
.versions-dropdown-label{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;
}
.versions-badges{display:flex;gap:6px;flex-wrap:wrap}

/* Track info */
.track-meta{padding-top:8px}
.track-artist{
  font-size:12px;font-family:'JetBrains Mono',monospace;
  color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;
}
.track-title-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.track-title{
  font-size:32px;font-weight:600;letter-spacing:-.5px;
  color:var(--text);line-height:1.1;
}
.track-title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.play-btn{
  width:68px;height:68px;border-radius:50%;background:var(--accent);
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;flex-shrink:0;transition:opacity .15s;
  box-shadow:0 0 32px var(--accent-g);
}
.play-btn:hover{opacity:.85}
.track-badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:28px}
.t-badge{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  border-radius:6px;padding:3px 10px;white-space:nowrap;
}
.t-bpm{color:var(--cyan);background:var(--cyan-d);border:1px solid rgba(54,217,217,.22)}
.t-fmt{color:var(--muted);background:var(--card-h);border:1px solid var(--border-b)}
.t-master{color:var(--gold);background:var(--gold-d);border:1px solid rgba(245,192,64,.22)}

/* Player */
.player{padding:0}
.player-times{
  display:flex;justify-content:space-between;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);
  margin-bottom:16px;
}
.player-bottom{display:flex;align-items:center;gap:14px}
.player-body{flex:1;min-width:0}
.waveform-wrap{position:relative;cursor:pointer;height:68px}
#waveform-canvas{display:block;width:100%;height:100%;border-radius:4px}

/* Details card */
.details-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;
}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--muted)}
.detail-val{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);
}
.detail-edit-btn{background:transparent;border:1px solid var(--border-b);border-radius:8px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.detail-edit-btn:hover{color:var(--text);border-color:var(--dim)}
.detail-edit-save{background:var(--accent);color:#fff;border:1px solid transparent;border-radius:8px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:opacity .15s}
.detail-edit-save:hover{opacity:.8}
.detail-input{background:var(--card-h);border:1px solid var(--border-b);border-radius:6px;padding:4px 8px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;transition:border-color .15s;width:160px;text-align:right}
.detail-input:focus{border-color:var(--accent)}
.detail-input select,.detail-input-select{background:var(--card-h);border:1px solid var(--border-b);border-radius:6px;padding:4px 8px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;transition:border-color .15s;width:160px;text-align:right;cursor:pointer}
.detail-edit-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px}
.detail-edit-status{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;min-height:14px}
.type-wrap{position:relative;display:inline-block}
.type-badge{font-family:'JetBrains Mono',monospace;font-size:11px;border-radius:6px;padding:3px 10px;white-space:nowrap;background:var(--accent-d);color:var(--accent);cursor:pointer;user-select:none;border:none;display:inline-block}
.type-badge:hover{opacity:.8}
.type-dropdown{display:none;position:absolute;top:calc(100% + 5px);right:0;background:var(--card);border:1px solid var(--border-b);border-radius:8px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:110px}
.type-dropdown.open{display:block}
.type-option{padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap}
.type-option:hover{background:var(--card-h)}

/* Footer */
footer{
  padding:28px 0 44px;text-align:center;font-size:11.5px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin-top:48px;
}
.footer-badge{
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:3px 9px;letter-spacing:.3px;font-size:11px;white-space:nowrap;
}
.footer-sep{color:var(--dim)}

@media(max-width:600px){
  .track-layout{grid-template-columns:1fr;gap:24px}
  .cover{max-width:220px;margin:0 auto}
  .track-title{font-size:26px}
  .topnav{gap:20px}.topnav-link{font-size:13px}
}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2d1b69,#6285e4);border:1.5px solid var(--border-b);margin-left:auto;flex-shrink:0;cursor:pointer;transition:opacity .15s;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:12px;font-family:"JetBrains Mono",monospace}
.avatar:hover{opacity:.8}

:root[data-theme="light"]{--bg:#f4f6f9;--surface:#ffffff;--card:#ffffff;--card-h:#eceff4;--border:#e4e8ee;--border-b:#d2d8e0;--text:#1b1e23;--muted:#5c6470;--dim:#9299a4;}
:root[data-theme="light"] body{background:radial-gradient(130% 100% at 50% 0%,#e8edf6 0%,var(--bg) 60%) fixed;}
:root[data-theme="light"] .list-table thead tr:hover{background:var(--card-h)}
:root[data-theme="light"] .orb{opacity:.55}

/* --- mobile responsive pass --- */
@media(max-width:640px){
  html{background:var(--bg)}
  header{flex-wrap:wrap;padding:22px 0 16px;gap:10px}
  .topnav{position:static;transform:none;order:3;width:100%;justify-content:center;gap:16px;margin-top:8px;flex-wrap:wrap}
  .topnav-link{font-size:13px}
  .stat-grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
  .table-scroll .list-table{min-width:560px}
}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('trakdb_settings')||'{}');if(s.theme==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="wrap">

  <header>
    <div class="logo">
      <a href="index.html" class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="7" width="3" height="4" rx="1" fill="white"/>
          <rect x="6" y="4" width="3" height="10" rx="1" fill="white" opacity=".85"/>
          <rect x="11" y="6" width="3" height="7" rx="1" fill="white" opacity=".65"/>
          <rect x="16" y="8" width="1.5" height="3" rx=".75" fill="white" opacity=".45"/>
        </svg>
      </a>
      <a href="index.html" class="logo-name">trak<em>db</em></a>
    </div>
    <nav class="topnav">
      <a href="index.html" class="topnav-link">home</a>
      <a href="music.html" class="topnav-link active">music</a>
      <a href="licenses.html" class="topnav-link">licenses</a>
      <a href="payments.html" class="topnav-link">payments</a>
      <a href="tools.html" class="topnav-link">tools</a>
    </nav>
    <div class="avatar" title="account">?</div>
  </header>

  <a href="music.html" id="back-link" class="back-link">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    back to music
  </a>

  <div class="track-layout">
    <div class="cover-col">
      <div class="cover">
        <canvas class="cover-gradient" id="cover-canvas"></canvas>
        <img class="cover-img" id="cover-img" alt="">
        <button class="cover-edit-btn" id="cover-edit-btn" title="Change cover art">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <input type="file" id="cover-input" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="cover-btns">
      <div class="versions-wrap">
        <button class="versions-btn" id="versions-btn">versions</button>
        <div class="versions-dropdown" id="versions-dropdown">
          <div class="versions-dropdown-label">sample rate</div>
          <div class="versions-badges">
            <span class="t-badge t-fmt">44.1 kHz</span>
            <span class="t-badge t-fmt">48 kHz</span>
            <span class="t-badge t-fmt">96 kHz</span>
          </div>
        </div>
      </div>
      <div class="tools-wrap" id="tools-wrap">
        <button class="analyze-btn" id="tools-btn">tools</button>
        <div class="tools-dropdown" id="tools-dropdown">
          <button class="tools-item" data-tool="lp" style="color:var(--lp)">Loudness Analyzer</button>
          <button class="tools-item" data-tool="kb" style="color:var(--red)">Key &amp; BPM Detector</button>
          <button class="tools-item" data-tool="conv" style="color:var(--gold)">File Converter</button>
          <button class="tools-item" data-tool="meta" style="color:var(--lime)">Metadata Editor</button>
          <button class="tools-item" data-tool="isrc" style="color:var(--orange)">ISRC Lookup</button>
        </div>
      </div>
    </div>

    <div class="track-meta">
      <div class="track-artist" id="track-artist">Artist Name</div>
      <div class="track-title-row">
        <div class="track-title" id="track-title">—</div>
        <div class="track-title-actions" id="track-title-actions"></div>
      </div>
      <div class="track-badges" id="track-badges"></div>

      <div class="player" id="player">
        <div class="player-times">
          <span id="time-cur">0:00</span>
          <span id="time-dur">--:--</span>
        </div>
        <div class="player-bottom">
          <button class="play-btn" id="play-btn">
            <svg id="play-ico" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div class="player-body">
            <div class="waveform-wrap" id="waveform-wrap">
              <canvas id="waveform-canvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="details-card" id="details-card"></div>
  </div>

  <footer>© 2026 trakdb</footer>

</div>
<script>
const ARTIST_DB = {
  'Admin1': {
    'Notbrian': {
      colors: ['#2d1b69','#1a3a6b','#080818'],
      tracks: [
        { name: 'Cold Summer',        bpm: 184, duration: '1:52', file: 'Cold Summer (184bpm, master).wav',        colors: ['#2d1b69','#1a3a6b','#0d4a6e'] },
        { name: 'College Sweetheart', bpm: 125, duration: '2:57', file: 'College Sweetheart (125bpm, master).wav', colors: ['#6b1a4a','#8b2252','#3d1a6b'] },
        { name: 'Multicolor',         bpm: 125, duration: '2:06', file: 'Multicolor (125bpm, master).wav',         colors: ['#1a4a2e','#1a3a6b','#4a1a6b'] },
        { name: 'Northstar',          bpm: 145, duration: '2:19', file: 'Northstar (145bpm, master).wav',          colors: ['#0d2a4a','#0a3a4a','#1a2a5e'] },
        { name: 'Pilot 43',           bpm: 138, duration: '3:12', file: 'Pilot 43.wav',           colors: ['#4a2a0a','#6b3a0d','#3a1a0a'] },
      ],
    },
    'NEVERHOME':   { colors: ['#3a0a0a','#6b0d0d','#1a0a0a'], tracks: [
        { name: 'Dreamlight 123',         bpm: 0, duration: '--:--', file: 'Dreamlight 123.mp3',         colors: ['#3a0a0a','#6b0d0d','#1a0a0a'] },
        { name: 'Killing Me Sweetly 410', bpm: 0, duration: '--:--', file: 'Killing Me Sweetly 410.mp3', colors: ['#3a0a0a','#6b0d0d','#1a0a0a'] },
        { name: 'Working For That Beach', bpm: 0, duration: '--:--', file: 'Working For That Beach.mp3', colors: ['#3a0a0a','#6b0d0d','#1a0a0a'] },
      ] },
    'The Strokes': { colors: ['#1a3a1a','#0d4a2e','#0a1a0a'], tracks: [] },
    'U2':          { colors: ['#1a1a3a','#0d1a6b','#0a0a2e'], tracks: [] },
  },
};

const session    = JSON.parse(localStorage.getItem('trakdb_session') || 'null') || { username: 'Admin1' };
const username   = session.username;
const accountDb  = ARTIST_DB[username] || {};

const params     = new URLSearchParams(location.search);
const artistName = params.get('artist') || Object.keys(accountDb)[0] || '';
const artist     = accountDb[artistName] || {};
const TRACKS     = artist.tracks || [];
const songBase   = `accounts/${username}/artists/${encodeURIComponent(artistName)}/songs/`;

const idx = Math.max(0, Math.min(parseInt(params.get('track') ?? 0), TRACKS.length - 1));
const t   = TRACKS[idx] || { name: '—', bpm: 0, duration: '--:--', file: '', colors: ['#111','#222','#333'] };
const filePath = t.file ? songBase + encodeURIComponent(t.file) : '';

/* Page title */
document.title = `trakdb — ${t.name}`;

/* Cover art */
const canvas = document.getElementById('cover-canvas');
const size   = 520;
canvas.width = canvas.height = size;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(size*.35, size*.3, 0, size*.5, size*.5, size*.8);
grad.addColorStop(0, t.colors[0]);
grad.addColorStop(0.5, t.colors[1]);
grad.addColorStop(1, t.colors[2]);
ctx.fillStyle = grad;
ctx.fillRect(0, 0, size, size);
/* subtle noise texture */
for (let i = 0; i < 6000; i++) {
  const x = Math.random() * size, y = Math.random() * size;
  const a = Math.random() * .06;
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.fillRect(x, y, 1, 1);
}

/* Cover art image (overrides the generated gradient when present) */
const coverBaseName = (t.file ? t.file.replace(/\.[^.]+$/, '') : t.name) || 'cover';
const coverPath = `accounts/${username}/artists/${encodeURIComponent(artistName)}/covers/${encodeURIComponent(coverBaseName)}.jpg`;
const coverImg   = document.getElementById('cover-img');
const coverInput = document.getElementById('cover-input');
const coverEditBtn = document.getElementById('cover-edit-btn');
(function loadCover() {
  const url = `https://raw.githubusercontent.com/desousabrian/desousabrian.github.io/main/${coverPath}?t=${Date.now()}`;
  const probe = new Image();
  probe.onload  = () => { coverImg.src = url; coverImg.classList.add('show'); };
  probe.onerror = () => {};
  probe.src = url;
})();

coverEditBtn.addEventListener('click', () => coverInput.click());
coverInput.addEventListener('change', async () => {

function imageFileToSquareJpeg(file, dim) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const c = document.createElement('canvas');
      c.width = c.height = dim;
      const cx = c.getContext('2d');
      const scale = Math.max(dim / img.width, dim / img.height);
      const w = img.width * scale, h = img.height * scale;
      cx.drawImage(img, (dim - w) / 2, (dim - h) / 2, w, h);
      resolve(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('could not read image')); };
    img.src = url;
  });
}

let detailsCur = {

  key:      t.key  || '',

function ghHeaders(pat) { return { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' }; }
function utf8ToB64(str) { const bytes = new TextEncoder().encode(str); let b = ''; bytes.forEach(x => b += String.fromCharCode(x)); return btoa(b); }
function b64ToUtf8(b64) { const bin = atob(b64.replace(/\n/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function getPat() { let p = localStorage.getItem('gh_pat'); if (!p) { p = window.prompt('GitHub personal access token:'); if (p) localStorage.setItem('gh_pat', p.trim()); } return p ? p.trim() : null; }
async function getValidPat() {
  for (let i = 0; i < 3; i++) {
    const pat = getPat(); if (!pat) return null;
    const r = await fetch('https://api.github.com/user', { headers: ghHeaders(pat) }).catch(() => null);
    if (r && r.ok) return pat;
    localStorage.removeItem('gh_pat'); window.alert('Token rejected — try a fresh one.');
  }
  return null;
}

function parseCsvRow(line) {
  const cols = []; let c = '', q = false;
  for (const ch of line) { if (ch==='"') q=!q; else if (ch===','&&!q){cols.push(c.trim());c='';}else c+=ch; }
  cols.push(c.trim()); return cols;
}

async function saveDetails() {
  const newTitle  = document.getElementById('de-title')?.value.trim()  || detailsCur.title;
  const newIsrc   = document.getElementById('de-isrc')?.value.trim()   || '';
  const newBpm    = parseInt(document.getElementById('de-bpm')?.value) || detailsCur.bpm;
  const newKey    = document.getElementById('de-key')?.value.trim()    || '';
  const newFormat = document.getElementById('de-format')?.value        || detailsCur.format;
  const newType   = document.getElementById('de-type-wrap')?.dataset.selected || detailsCur.type;
  const newReleased = document.getElementById('de-released')?.value.trim() ?? detailsCur.released;
  const newGenre    = document.getElementById('de-genre')?.value.trim()    ?? detailsCur.genre;
  const newLabel    = document.getElementById('de-label')?.value.trim()    ?? detailsCur.label;

  document.getElementById('detail-save-btn').disabled = true;
  detailStatus.textContent = 'saving…'; detailStatus.style.color = 'var(--muted)';

  try {
    const pat = await getValidPat();
    if (!pat) { document.getElementById('detail-save-btn').disabled = false; detailStatus.textContent = ''; return; }

    const apiUrl  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${tracksCsvPath}`;
    const fileRes = await fetch(apiUrl, { headers: ghHeaders(pat) });
    let sha = null, existing = 'File,Name,ISRC,BPM,Key,Format,Type,Released,Genre,Label\n';
    if (fileRes.ok) { const j = await fileRes.json(); sha = j.sha; existing = b64ToUtf8(j.content); }

    const lines = existing.trim().split('\n');
    const headers = parseCsvRow(lines[0]);
    /* Append any columns this CSV predates, so older files gain them */
    function ensureCol(colName) {
      let i = headers.indexOf(colName);
      if (i < 0) { headers.push(colName); i = headers.length - 1; }
      return i;
    }
    const fileCol = ensureCol('File'), nameCol = ensureCol('Name'),
          isrcCol = ensureCol('ISRC'), bpmCol  = ensureCol('BPM'),
          keyCol2 = ensureCol('Key'),  fmtCol  = ensureCol('Format'),
          typeCol = ensureCol('Type'), relCol  = ensureCol('Released'),
          genreCol = ensureCol('Genre'), labelCol = ensureCol('Label');
    const header = headers.join(',');

    function csvVal(v) { return (v+'').includes(',') || (v+'').includes('"') ? `"${(v+'').replace(/"/g,'""')}"` : v+''; }

    let found = false;
    const newLines = lines.slice(1).map(l => {
      const cols = parseCsvRow(l);
      if (cols[fileCol] !== t.file) return l;
      found = true;
      cols[nameCol]  = newTitle;
      cols[isrcCol]  = newIsrc;
      cols[bpmCol]   = newBpm;
      cols[keyCol2]  = newKey;
      cols[fmtCol]   = newFormat;
      cols[typeCol]  = newType;
      cols[relCol]   = newReleased;
      cols[genreCol] = newGenre;
      cols[labelCol] = newLabel;
      for (let k = 0; k < headers.length; k++) if (cols[k] === undefined) cols[k] = '';
      return cols.map(csvVal).join(',');
    });
    if (!found) {
      const row = [];
      row[fileCol] = t.file; row[nameCol] = newTitle; row[isrcCol] = newIsrc;
      row[bpmCol] = newBpm; row[keyCol2] = newKey; row[fmtCol] = newFormat;
      row[typeCol] = newType; row[relCol] = newReleased; row[genreCol] = newGenre; row[labelCol] = newLabel;
      for (let k = 0; k < headers.length; k++) if (row[k] === undefined) row[k] = '';
      newLines.push(row.map(csvVal).join(','));
    }

    const content = utf8ToB64([header, ...newLines].join('\n') + '\n');
    const body = { message: `Update track metadata: ${t.file}`, content, branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const putRes = await fetch(apiUrl, { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify(body) });
    if (!putRes.ok) { const e = await putRes.json().catch(()=>({})); throw new Error(e.message || `Save failed (${putRes.status})`); }

    detailsCur = { title: newTitle, isrc: newIsrc, bpm: newBpm, key: newKey, format: newFormat, type: newType, released: newReleased, genre: newGenre, label: newLabel };
    document.getElementById('track-title').textContent = newTitle;
    document.title = `trakdb — ${newTitle}`;
    renderDetails(false);
    detailStatus.textContent = 'saved ✓'; detailStatus.style.color = 'var(--muted)';
    setTimeout(() => { detailStatus.textContent = ''; }, 2500);
  } catch(err) {
    detailStatus.textContent = `failed: ${err.message}`; detailStatus.style.color = '#e0667a';
    document.getElementById('detail-save-btn').disabled = false;
  }
}

const playIcon  = `<polygon points="5 3 19 12 5 21 5 3"/>`;

function fmt(s) {
  if (!isFinite(s)) return '--:--';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

/* Waveform */
let amps = null;

/* Seeded pseudo-random so placeholder looks like a real waveform */
function makeplaceholder(seed) {
  let s = seed;
  const rng = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  return Array.from({ length: 300 }, (_, i) => {
    const env = Math.sin((i / 300) * Math.PI) * 0.55 + 0.25;
    return Math.max(0.04, env * (0.35 + rng() * 0.65));
  });
}

function initCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const w    = waveWrap.offsetWidth  || 400;
  const h    = waveWrap.offsetHeight || 64;
  waveCanvas.width  = w * dpr;
  waveCanvas.height = h * dpr;
  waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!amps) amps = makeplaceholder(t.name.split('').reduce((a, c) => a + c.charCodeAt(0), 0));
  drawWave(0);
}

function drawWave(progress) {
  const dpr = window.devicePixelRatio || 1;
  const w   = waveCanvas.width  / dpr;
  const h   = waveCanvas.height / dpr;
  waveCtx.clearRect(0, 0, w, h);

  const barW = 2, gap = 1.5, step = barW + gap;
  const bars = Math.floor(w / step);
  const mid  = h / 2;

  for (let i = 0; i < bars; i++) {
    const x    = i * step;
    const amp  = amps[Math.floor(i * amps.length / bars)];
    const barH = Math.max(3, amp * h * 0.9);
    const pct  = x / w;
    waveCtx.fillStyle = pct <= progress ? 'rgba(98,133,228,1)' : 'rgba(98,133,228,0.28)';
    waveCtx.fillRect(x, mid - barH / 2, barW, barH);
  }

  /* Playhead line */
  if (progress > 0 && progress < 1) {
    const px = progress * w;
    waveCtx.fillStyle = 'rgba(255,255,255,0.85)';
    waveCtx.fillRect(px - 1, 0, 2, h);
  }
}

async function loadWaveform() {
  try {
    const encodedPath = filePath;
    const res    = await fetch(encodedPath);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf    = await res.arrayBuffer();
    const actx   = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await actx.decodeAudioData(buf);
    const raw    = decoded.getChannelData(0);
    const BARS   = 300;
    const block  = Math.floor(raw.length / BARS);
    const real = Array.from({ length: BARS }, (_, i) => {
      let sum = 0;
      for (let j = 0; j < block; j++) sum += Math.abs(raw[i * block + j]);
      return sum / block;
    });
    const max = Math.max(...real);
    amps = real.map(a => a / max);
    drawWave(audio.duration ? audio.currentTime / audio.duration : 0);
  } catch(e) {
    console.warn('Waveform load failed:', e);
  }
}

audio.addEventListener('loadedmetadata', () => { timeDur.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  timeCur.textContent = fmt(audio.currentTime);
  drawWave(audio.currentTime / audio.duration);
});
audio.addEventListener('ended', () => {
  playIco.innerHTML = playIcon;
  timeCur.textContent = '0:00';
  drawWave(0);
});

playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playIco.innerHTML = pauseIcon;
  } else {
    audio.pause();
    playIco.innerHTML = playIcon;
  }
});

waveWrap.addEventListener('click', e => {
  if (!audio.duration) return;
  const r = waveWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  if (audio.paused) { audio.play(); playIco.innerHTML = pauseIcon; }
});
